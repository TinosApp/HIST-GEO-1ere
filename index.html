<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e5a3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Histoire-Géographie 1ère</title>
<style>
:root{--bg:#f5f6f2;--surf:#ffffff;--ink:#17261f;--mute:#5d6b63;--line:#dfe4dc;--green:#0e5a3a;--green-d:#0a4129;--gold:#f2b705;--red:#c7352b;--okbg:#e4f3ea;--kobg:#fbe7e4;--hl:#fff6d6;
--head:Georgia,"Times New Roman",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--surf:#18251e;--ink:#e8efe9;--mute:#9fb0a5;--line:#2a3b31;--green:#2d9467;--green-d:#1f6e4c;--okbg:#17382a;--kobg:#3b1f1c;--hl:#3a3414}}
:root[data-theme="dark"]{--bg:#101a15;--surf:#18251e;--ink:#e8efe9;--mute:#9fb0a5;--line:#2a3b31;--green:#2d9467;--green-d:#1f6e4c;--okbg:#17382a;--kobg:#3b1f1c;--hl:#3a3414}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
#main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
.hd{margin:4px 0 16px}
.hd h1{font-family:var(--head);font-size:26px;line-height:1.2;margin:2px 0 8px;font-weight:700}
.hd.home h1{font-size:30px}
.eyebrow{margin:0;color:var(--green);font-weight:600;font-size:14px}
.q{margin:0;color:var(--mute)}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:10px;padding:14px;margin:0 0 10px;color:inherit;font:inherit;cursor:pointer}
.card:active{background:var(--hl)}
.num{flex:0 0 auto;min-width:46px;height:46px;border-radius:8px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--head)}
.ct h2{margin:0 0 4px;font-size:17px;line-height:1.3;font-family:var(--head)}
.ct p{margin:0;color:var(--mute);font-size:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;margin-right:4px}
.tag.h{background:#fde9b0;color:#6a4b00}.tag.g{background:#cfeadb;color:#0b4a2e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.h{background:#51400a;color:#ffe08a}:root:not([data-theme="light"]) .tag.g{background:#1d4d37;color:#bfe9d1}}
.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.box h3,.keybox h3,.corr h3{margin:0 0 6px;font-family:var(--head);font-size:18px}
.box.small{font-size:15px}
.muted{color:var(--mute);font-size:14px}
.note{color:var(--mute);font-size:14px;margin:14px 0}
.acc{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.acc summary{cursor:pointer;padding:14px;font-weight:600;font-family:var(--head);font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--green);font-size:22px;line-height:1}
.acc[open] summary::after{content:"–"}
.acc-b{padding:0 14px 14px;overflow-x:auto}
.acc-b p{margin:0 0 10px}.acc-b ul,.acc-b ol,.box ul,.box ol,.keybox ul,.corr ul{margin:0 0 10px;padding-left:20px}
.acc-b li,.box li,.keybox li,.corr li{margin:0 0 6px}
.keybox{background:var(--hl);border:1px solid var(--gold);border-radius:10px;padding:14px;margin:14px 0}
.keybox ul{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{appearance:none;border:0;background:var(--green);color:#fff;font:inherit;font-weight:600;padding:13px 18px;border-radius:10px;cursor:pointer;min-height:48px}
.btn:active{background:var(--green-d)}
.btn.alt{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn.sticky{width:100%;margin-top:14px}
.back{appearance:none;border:0;background:none;color:var(--green);font:inherit;font-weight:600;padding:8px 0;margin:0 0 6px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer;min-height:38px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.corr{margin-top:14px}
.cq{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.cq p{margin:0 0 8px}.cqt{font-weight:600}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.prog div{height:100%;background:var(--gold);transition:width .25s}
.qt{font-family:var(--head);font-size:21px;line-height:1.35;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;background:var(--surf);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit;cursor:pointer;min-height:50px}
.opt.ok{border-color:var(--green);background:var(--okbg)}
.opt.ko{border-color:var(--red);background:var(--kobg)}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.fb{border-radius:10px;padding:12px 14px;margin-top:14px}
.okb{background:var(--okbg);border:1px solid var(--green)}.kob{background:var(--kobg);border:1px solid var(--red)}
.flash{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px;margin:10px 0 14px;min-height:150px}
.fq{font-family:var(--head);font-size:21px;margin:0}
.fa{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.fa p{margin:8px 0 0;color:var(--mute)}
.reps{display:grid;gap:8px}
.rep{display:flex;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rk{flex:0 0 38%;font-weight:700;font-family:var(--head);color:var(--green)}
.rv{flex:1;font-size:15px}
.rc{display:block;color:var(--mute);font-size:12px;margin-top:2px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nb{flex:1;appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
.nb.on{color:var(--green);font-weight:700}
blockquote.doc{margin:0 0 8px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--bg);font-family:var(--head);font-size:17px}
.warn{background:var(--hl);border:1px solid var(--gold);border-radius:8px;padding:10px 12px}
.sec{font-family:var(--head);font-size:20px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.ident{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.ident div{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ident span{display:block;color:var(--mute);font-size:12px}.ident b{font-size:14px;line-height:1.3;display:block}
@media (max-width:420px){.ident{grid-template-columns:1fr}}
.plan{margin:0;padding-left:22px}.plan li{margin:0 0 4px}
.box.intro{border-left:5px solid var(--green)}
.rn{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:6px;background:var(--green);color:#fff;font-size:14px;margin-right:10px;flex:0 0 auto}
.acc summary{align-items:center}
.tbl{overflow-x:auto;margin:0 0 12px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surf)}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl thead th{background:var(--green);color:#fff;border-color:var(--green)}
.tbl tbody th{background:var(--hl);font-weight:700;min-width:96px}

:root{--hist:#a3322a}
:root[data-theme="dark"]{--hist:#d9625a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hist:#d9625a}}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border-bottom:1px solid var(--line);padding:8px 14px}
.tt{display:flex;align-items:center;gap:10px}
.tt b{display:block;font-family:var(--head);font-size:16px;line-height:1.1}
.tt span{display:block;color:var(--mute);font-size:12px}
.stripe{display:block;width:6px;height:34px;border-radius:3px;background:linear-gradient(#0e5a3a 0 33%,#f2b705 33% 66%,#c7352b 66%)}
.thm{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 100%);color:#fff;border-radius:14px;padding:18px 18px 16px;margin:0 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(#f2b705 0 50%,#c7352b 50%)}
.hero h1{font-family:var(--head);font-size:28px;line-height:1.15;margin:2px 0 6px}
.hero .eyebrow{color:#ffd96b}.hero .q{color:#e6f1ea}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--head);font-size:22px;color:var(--green)}
.stats span{font-size:12px;color:var(--mute)}
.card.h{border-left-color:var(--hist)}
.num.h{background:var(--hist)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--gold)}
.ct .pc{font-size:12px;margin:0}
.okt{color:var(--green)}
.tag.k{background:var(--hl);color:var(--ink);border:1px solid var(--gold)}
.timer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.timer .tl{color:var(--mute);font-size:13px}
.timer b{font-family:var(--head);font-size:22px;min-width:84px;font-variant-numeric:tabular-nums}
.mini{appearance:none;border:0;background:var(--green);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:38px}
.mini.alt{background:transparent;color:var(--green);border:1px solid var(--green)}
.search{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);margin:0 0 12px}
.search:focus{outline:3px solid var(--gold);border-color:var(--gold)}
.btn.read{width:100%;margin:0 0 6px;background:transparent;color:var(--green);border:2px dashed var(--green)}
.btn.read.isread{background:var(--okbg);border-style:solid}
.tr{display:flex;align-items:center;gap:8px}
.ser{appearance:none;border:1px solid var(--green);background:transparent;color:var(--green);font:inherit;font-weight:700;font-size:13px;padding:0 12px;height:40px;border-radius:99px;cursor:pointer}
.ser.unlock{background:var(--gold);border-color:var(--gold);color:#17261f}
.ser-card{border-left-width:8px;padding:18px 14px}
.ser-card .num{min-width:58px;height:58px;font-size:17px}
.err{color:var(--red);min-height:1.3em;margin:6px 0;font-size:14px}
.search.code{font-family:"Courier New",monospace;font-size:20px;letter-spacing:2px;text-align:center;text-transform:uppercase}
.owner{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.owner a,.box a{color:var(--green);font-weight:700}
.trial{background:var(--hl);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.trial .btn{margin-top:10px}
.card.locked{opacity:.78;border-style:dashed;border-left-color:var(--mute)}
.num.lk{background:var(--mute);font-size:22px}
.trialbox{border-left:5px solid var(--gold)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  id: "sa1", num: 1, disc: "Histoire", titre: "Le monde de 1919 à 1939",
  question: "Comment le monde est-il passé de la paix de 1919 à la guerre de 1939 ?",
  intro: `<p>Le monde sort meurtri de la Première Guerre mondiale. L'entre-deux-guerres comprend trois grandes phases : une <b>stabilité trompeuse</b> (années 1920), la <b>crise économique de 1929</b> et la grande dépression, puis la <b>marche vers la guerre</b> (années 1930).</p>`,
  parts: [
    { t: "Les traités de paix de 1919-1920", h: `
<p>La conférence de la paix se tient à Paris du <b>18 janvier au 28 juin 1919</b> (galerie des Glaces, Versailles). Trente-deux pays vainqueurs ou neutres y siègent, dont cinq dominent les débats (États-Unis, Grande-Bretagne, France, Italie, Japon). Les traités sont élaborés entre vainqueurs seulement, avec notamment Clemenceau (France), Wilson (États-Unis), Lloyd George (Grande-Bretagne) et Orlando (Italie). Les vaincus ne participent pas aux négociations et la Russie bolchevique n'est pas invitée.</p>
<p><b>Le traité de Versailles (28 juin 1919)</b> règle le sort de l'Allemagne, déclarée responsable de la guerre :</p>
<ul>
<li><b>Clauses territoriales</b> : l'Allemagne perd 1/7 de son territoire (88 000 km²) et 1/10 de sa population (8 millions d'habitants). Elle rend l'Alsace-Lorraine à la France, cède Eupen et Malmédy à la Belgique, la Haute-Silésie, la Prusse orientale et le corridor de Dantzig à la Pologne (qui obtient ainsi un accès à la mer Baltique). Ses colonies sont confiées à la SDN.</li>
<li><b>Clauses économiques et financières</b> : livraison de sa flotte marchande, perte des mines de la Sarre et du minerai de fer lorrain, internationalisation des brevets industriels, réparations fixées à <b>132 milliards de marks-or</b>.</li>
<li><b>Clauses militaires</b> : armée limitée à 100 000 hommes, pas d'armes offensives, service militaire supprimé, Rhénanie démilitarisée.</li>
</ul>
<p>Au total, l'Allemagne est territorialement mutilée, économiquement fragilisée et militairement désarmée.</p>
<p><b>Les autres traités</b> :</p>
<ul>
<li><b>Saint-Germain-en-Laye</b> (10 septembre 1919) avec l'Autriche ;</li>
<li><b>Neuilly</b> (27 novembre 1919) avec la Bulgarie ;</li>
<li><b>Trianon</b> (4 juin 1920) avec la Hongrie ;</li>
<li><b>Sèvres</b> (10 août 1920) avec la Turquie : dislocation de l'Empire ottoman, ses possessions arabes passent sous mandat de la France et de la Grande-Bretagne.</li>
</ul>
<p>Les traités de Saint-Germain, Trianon et Neuilly démantèlent l'Empire d'Autriche-Hongrie et font naître de nouveaux États (Autriche, Hongrie, Tchécoslovaquie, Yougoslavie, Pologne restaurée). La <b>Société des Nations (SDN)</b> est créée en janvier 1920 pour garantir une paix durable.</p>` },

    { t: "Frustrations et désunion des vainqueurs", h: `
<p>Les traités ont créé assez de frustrations pour rendre la paix fragile.</p>
<p><b>Les frustrations des vaincus et de la Russie</b></p>
<ul>
<li>L'Allemagne considère le traité de Versailles comme un <b>« diktat »</b> : elle l'a signé contraint et forcée, sans avoir participé à son élaboration.</li>
<li>L'Autriche, la Hongrie et la Bulgarie, réduites territorialement, nourrissent la volonté de réviser les traités. Roumanie, Tchécoslovaquie et Yougoslavie forment la <b>Petite Entente</b> (1920-1921) sous l'égide de la France.</li>
<li>La Turquie veut remettre en cause le traité de Sèvres. La Russie bolchevique, tenue à l'écart, accepte mal les pertes territoriales (États baltes, Bessarabie, parties de la Biélorussie et de l'Ukraine).</li>
</ul>
<p><b>La désunion des vainqueurs</b></p>
<ul>
<li><b>Italie</b> : déçue de ne pas recevoir Fiume et la Dalmatie promises en 1915, elle parle de « victoire mutilée ».</li>
<li><b>Grande-Bretagne</b> : les idées de l'économiste Keynes retournent l'opinion contre le « diktat » ; Londres souhaite le redressement de l'Allemagne pour contrebalancer la France.</li>
<li><b>États-Unis</b> : arrivée au pouvoir des Républicains, <b>isolationnisme</b> ; le Sénat refuse de ratifier le traité de Versailles et l'adhésion à la SDN.</li>
</ul>` },

    { t: "Les difficultés de la paix (1919-1924)", h: `
<ul>
<li><b>La crise économique de 1920-1921</b> : reconversion de l'économie de guerre, endettement européen, dépréciation des monnaies. Elle provoque agitation sociale et instabilité politique (Italie, Allemagne) et complique le problème des réparations.</li>
<li><b>La tension franco-allemande</b> : en avril 1920, la France envoie ses troupes à Francfort et Darmstadt après l'entrée de troupes allemandes dans la zone démilitarisée. Principale bénéficiaire des réparations (52 % des 132 milliards de marks-or), elle exige un paiement rapide, mais l'Allemagne multiplie les retards de paiement et de livraison de charbon. Le <b>11 janvier 1923</b>, la France, soutenue par la Belgique, occupe la <b>Ruhr</b>. Les ouvriers allemands se mettent en grève, l'épreuve de force dure environ dix mois et ruine l'économie allemande ; la France accepte en octobre 1923 une conférence internationale sur les réparations.</li>
<li><b>Les litiges territoriaux</b> : guerre russo-polonaise de 1919-1920 (ligne Curzon, traité de Riga en 1921), litige italo-yougoslave (Istrie à l'Italie), guerre gréco-turque (la Turquie récupère la Thrace et Smyrne).</li>
</ul>` },

    { t: "La détente internationale (1924-1929)", h: `
<p><b>Les facteurs</b> : redressement économique (mark et franc stabilisés), pressions britannique et américaine sur la France, arrivée d'hommes conciliants (Briand en France, Stresemann en Allemagne, Kellogg aux États-Unis, Chamberlain en Grande-Bretagne), regain de vitalité de la SDN.</p>
<p><b>Les manifestations</b></p>
<ul>
<li><b>Plan Dawes</b> (Londres, août 1924) : fixe les annuités allemandes avec moratoire en cas de difficulté.</li>
<li><b>Accords de Locarno</b> (octobre 1925) : l'Allemagne reconnaît ses frontières occidentales et accepte l'arbitrage de la SDN.</li>
<li><b>Admission de l'Allemagne à la SDN</b> (septembre 1926) : fin de son isolement.</li>
<li><b>Pacte Briand-Kellogg</b> (août 1928) : signé par 63 pays, il met la guerre « hors la loi ».</li>
<li><b>Plan Young</b> (La Haye, 1929) : dette ramenée à 38 milliards de marks-or, échelonnée sur 59 ans.</li>
</ul>` },

    { t: "Démocraties fragiles et régimes forts", h: `
<p><b>Les démocraties libérales fragiles</b></p>
<ul>
<li><b>Grande-Bretagne</b> : multipartisme et instabilité (huit cabinets en quinze ans), chômage permanent (un actif sur dix), grève générale de 1926, crise irlandaise.</li>
<li><b>France</b> : prépondérance du Parlement et instabilité ministérielle (durée moyenne des gouvernements : sept mois), grandes grèves de 1919-1920, opposition Bloc national / Cartel des gauches.</li>
<li><b>Allemagne de Weimar</b> : République impopulaire, attentats et putschs (Kapp en 1920, Hitler à Munich en 1923), inflation et misère en 1923.</li>
</ul>
<p><b>Les régimes forts</b></p>
<ul>
<li><b>URSS</b> : Lénine instaure la « dictature du prolétariat », qui devient dictature du parti communiste. NEP en 1921 (libéralisation partielle de l'économie), création de l'URSS en décembre 1922. Staline accède au pouvoir en 1928 et durcit le régime.</li>
<li><b>Italie</b> : crise économique et sociale, six gouvernements entre 1920 et 1922. Le roi Victor-Emmanuel III nomme <b>Mussolini</b> chef du gouvernement (1922) ; les lois fascistes de 1925-1926 suppriment les libertés syndicales, de presse et d'association.</li>
</ul>` },

    { t: "La crise économique de 1929", h: `
<p><b>Les causes</b> (liées au système capitaliste libéral) :</p>
<ul>
<li><b>Surproduction</b> : l'État n'intervient pas, la production dépasse les capacités du marché américain saturé et du marché européen fermé ;</li>
<li><b>Abus de crédit</b> : consommateurs et banques surendettés ;</li>
<li><b>Spéculation boursière</b> : de 1927 à 1929, les cours montent de 89 % alors que la production industrielle n'augmente que de 13 %.</li>
</ul>
<p><b>Le déclenchement</b> : krach de la Bourse de Wall Street, <b>jeudi 24 octobre 1929</b> (« jeudi noir »), puis panique ; retraits massifs, faillites de banques.</p>
<p><b>Les manifestations</b></p>
<ul>
<li><b>États-Unis</b> : vente massive d'actions, retraits de dépôts, faillites bancaires (522 banques en faillite en octobre 1931 ; le 30 mars 1933, tous les États déclarent leurs banques en difficulté), arrêt des investissements, mévente, production industrielle presque divisée par deux entre 1929 et 1933, <b>14 millions de chômeurs en 1933</b>.</li>
<li><b>Europe</b> : l'Autriche (Kredit Anstalt de Vienne, mai 1931) puis l'Allemagne (Danat Bank de Berlin, juillet 1931) sont touchées les premières, suivies de la Grande-Bretagne puis, plus tardivement et moins profondément, de la France. La production recule de 30 % en Grande-Bretagne (1929-1931) et de 20 % en France (1932-1933). Chômeurs en 1933 : 6 millions en Allemagne, 3 millions en Grande-Bretagne, 1,5 million en France. La dévaluation de la livre sterling (1931) perturbe les échanges.</li>
<li><b>Reste du monde</b> : Amérique latine et Asie touchées (exportations japonaises en baisse de 47 % et importations de 55 % par rapport à 1929) ; colonies africaines frappées par l'effondrement des cours et la dépendance envers les métropoles. Seule l'URSS, économie planifiée, échappe à la crise.</li>
</ul>` },

    { t: "Conséquences et remèdes à la crise", h: `
<p><b>Les conséquences</b></p>
<ul>
<li><b>Économiques</b> : fin du libéralisme classique, protectionnisme, cloisonnement en zones monétaires rivales (zone dollar, zone sterling, zone franc), recul du commerce mondial.</li>
<li><b>Sociales</b> : chômage de masse, ruine des agriculteurs et des rentiers, misère aggravée dans les colonies.</li>
<li><b>Politiques</b> : méfiance et rivalités internationales, échec du projet de Fédération européenne, abandon des réparations (le chancelier Brüning gèle aussi les avoirs étrangers), refus américain d'annuler les dettes de guerre européennes, isolationnisme renforcé, perte de prestige des démocraties et montée des régimes autoritaires (Mussolini, Franco, Salazar, Pilsudski, Hitler). La crise accentue aussi le fossé entre nations riches (<i>having</i>) et nations pauvres (<i>having not</i>).</li>
</ul>
<p><b>Les remèdes</b></p>
<ul>
<li><b>Mesures générales</b> : contrôle des banques, <b>déflation</b>, <b>dévaluation</b> (livre 1931, yen 1932, dollar 1933, franc 1936), <b>dirigisme</b> (limitation de la production, protectionnisme, grands travaux, subventions).</li>
<li><b>États-Unis : le New Deal</b> de Franklin D. Roosevelt (élu en 1932, au pouvoir en mars 1933) : contrôle des banques et de la Bourse, garantie des dépôts, dévaluation du dollar de moitié (juin 1933) et abandon de l'étalon-or, <b>AAA</b> (12 mai 1933, aide aux agriculteurs), <b>NIRA</b> (16 juin 1933, relance industrielle), <b>Tennessee Valley Authority</b> (grands travaux), <b>Social Security Act</b> (1935), accords de réciprocité commerciale (1934).</li>
<li><b>Grande-Bretagne</b> : protectionnisme modéré (novembre 1931), préférence impériale (conférence d'Ottawa, juillet-août 1932), dévaluation de la livre, compression des dépenses publiques, hausse des impôts, nationalisation des transports aériens et de l'industrie de guerre.</li>
<li><b>France</b> : 40 heures, congés payés, nationalisation des chemins de fer (SNCF) et de l'industrie d'armement, code de la famille (Daladier) pour stimuler les naissances, hausse des impôts, contrôle des banques, dévaluation du franc (septembre 1936).</li>
<li><b>Dictatures</b> : en Italie, nationalisations, production locale de produits autrefois importés, assèchement et irrigation, grands travaux ; en Allemagne, interdiction de sortie des capitaux puis, avec Hitler (1933), autarcie, grands travaux et réarmement.</li>
</ul>` },

    { t: "La marche vers la guerre (1931-1939)", h: `
<p><b>Les facteurs favorables à la montée des périls</b> : en 1933, l'isolationnisme américain se renforce et s'accompagne de lois de neutralité (1935-1937, embargo sur les armes et munitions ; loi « Cash and Carry » de 1937). Les États-Unis laissent les démocraties européennes face à leurs responsabilités, tandis que la France et la Grande-Bretagne réagissent mollement aux provocations.</p>
<p><b>Les coups de force hors d'Europe</b></p>
<ul>
<li><b>Japon en Mandchourie</b> (1931-1933) : frappé par la crise et poussé par les militaires, le Japon cherche des débouchés. Prétextant un sabotage de sa voie ferrée et la mort du capitaine Nakamura, il envahit la Mandchourie le <b>19 septembre 1931</b>. Il crée l'État du <b>Mandchoukouo</b> (1932), véritable protectorat japonais, et quitte la SDN en 1933.</li>
<li><b>Italie en Éthiopie</b> : Mussolini veut une colonie de peuplement et un fait d'armes pour le prestige du fascisme. Après l'incident de Wal-Wal (décembre 1934), la guerre dure du <b>3 octobre 1935 au 6 mai 1936</b>. Mussolini se rapproche alors de Hitler : <b>Axe Rome-Berlin</b> (protocole du 25 octobre 1936), adhésion de l'Italie au <b>pacte anti-Komintern</b> (6 novembre 1937), d'où l'Axe Rome-Berlin-Tokyo.</li>
<li><b>Japon en Chine</b> (juillet 1937) : incident du pont Marco Polo, occupation de Pékin, du nord puis du sud jusqu'à Canton ; mi-1938, toutes les côtes sont japonaises. La SDN se contente d'une condamnation.</li>
</ul>
<p><b>Les coups de force en Europe</b></p>
<ul>
<li><b>Hitler</b> au pouvoir en <b>janvier 1933</b> : régime nazi, sortie de la SDN (1933), volonté de vider Versailles de son contenu et conquête d'un <b>espace vital</b> (Lebensraum).</li>
<li>Échec de l'Anschluss en juillet 1934 (assassinat du chancelier Dollfuss, opposition de Mussolini) ; retour de la Sarre (janvier 1935) ; service militaire rétabli (mars 1935) ; accord de Stresa (11 avril 1935) entre la France, la Grande-Bretagne et l'Italie, brisé par la crise éthiopienne ; <b>remilitarisation de la Rhénanie</b> (1936).</li>
<li><b>Guerre d'Espagne</b> (1936) : Hitler et Mussolini aident massivement Franco, testent leurs armes et se rapprochent.</li>
<li><b>Anschluss</b> (mars 1938) : après l'entrevue de Berchtesgaden (12 février 1938), le chancelier Schuschnigg est contraint de faire entrer le nazi Seyss-Inquart au gouvernement ; l'Allemagne annexe l'Autriche.</li>
<li><b>Sudètes et Munich</b> : Hitler exige le rattachement de cette région peuplée de 3,5 millions d'Allemands. Benès refuse puis la guerre paraît imminente. Sur l'initiative de Mussolini, la conférence de <b>Munich (29-30 septembre 1938)</b> réunit Hitler, Mussolini, Chamberlain et Daladier : les démocraties cèdent.</li>
<li><b>Liquidation de la Tchécoslovaquie</b> : indépendance de la Slovaquie (Mgr Tiso, 14 mars 1939) ; le 15 mars, le président Hacha est contraint de remettre la Bohême-Moravie, devenue protectorat allemand ; Memel est annexée le 22 mars. La France et la Grande-Bretagne ne réagissent pas.</li>
<li><b>Crise polonaise</b> : Hitler réclame Dantzig et une voie extraterritoriale à travers le corridor ; la Pologne refuse. <b>Pacte d'acier</b> avec l'Italie (22 mai 1939), <b>pacte germano-soviétique</b> Ribbentrop-Molotov (23 août 1939).</li>
<li><b>1er septembre 1939</b> (4 h 30) : invasion de la Pologne ; le <b>3 septembre</b>, la Grande-Bretagne (11 h) puis la France (17 h) déclarent la guerre à l'Allemagne. La Pologne cesse de résister le 27 septembre. La Seconde Guerre mondiale commence.</li>
</ul>` }
  ],
  cles: [
    "Versailles (28 juin 1919) : Allemagne amputée, désarmée, réparations de 132 milliards de marks-or.",
    "La paix est fragile : diktat, Petite Entente, désunion des vainqueurs, isolationnisme américain.",
    "Détente 1924-1929 : Dawes, Locarno, entrée de l'Allemagne à la SDN, Briand-Kellogg, Young.",
    "Crise de 1929 : surproduction, abus de crédit, spéculation ; krach du 24 octobre 1929.",
    "Remèdes : déflation, dévaluation, dirigisme ; New Deal aux États-Unis.",
    "La crise affaiblit les démocraties et renforce les dictatures (Italie, Allemagne, Japon).",
    "Marche vers la guerre : Mandchourie, Éthiopie, Rhénanie, Espagne, Anschluss, Munich, Pologne."
  ]
});

SA.push({
  id: "sa2", num: 2, disc: "Géographie", titre: "L'enjeu des communications dans l'espace CEDEAO",
  question: "Quels sont les réseaux de communication de l'espace CEDEAO, leurs atouts, leurs insuffisances et leurs perspectives ?",
  intro: `<p>Les communications sont un maillon indispensable de l'économie. Dans l'espace CEDEAO, aux routes et aux chemins de fer s'ajoutent désormais les télécommunications et l'internet. Malgré les progrès, la CEDEAO reste loin de performances à la hauteur de ses dimensions et de ses ambitions.</p>`,
  parts: [
    { t: "Les transports terrestres", h: `
<p><b>Le réseau routier</b> : « la route du développement passe par le développement de la route ». Projets communautaires de la CEDEAO :</p>
<ul>
<li>route trans-côtière <b>Lagos-Nouakchott</b> (4 560 km), réalisée à 83 % ;</li>
<li>route trans-sahélienne <b>Dakar-N'Djamena</b> (4 460 km), réalisée à plus de 89 % ;</li>
<li>routes d'interconnexion (11 500 km) reliant notamment les pays enclavés (Mali, Burkina Faso, Niger) aux ports, réalisées à 67 %.</li>
</ul>
<p><b>Le réseau ferroviaire</b> : installé par les colonisateurs pour l'économie de traite, il est en déclin malgré quelques axes fonctionnels (Abidjan-frontière du Burkina Faso, Dakar-Bamako). Longueur totale : <b>10 188 km</b>, répartis en 11 réseaux nationaux dont six à vocation sous-régionale. Lancement de la construction de la <b>boucle ferroviaire Niger-Bénin-Burkina-Côte d'Ivoire</b> le 7 avril 2014.</p>` },

    { t: "Transports aérien, maritime et fluvial", h: `
<ul>
<li><b>Transport aérien</b> : peu développé. Les compagnies comme Air Afrique, Nigeria Airways, Ghana Airways ou Air Burkina ont disparu, laissant la place à des compagnies étrangères (Air France, Royal Air Maroc, Ethiopian Airlines). Quelques compagnies subsistent (Air Sénégal, ASKY). La CEDEAO vise surtout un système sûr et fiable reliant les États membres.</li>
<li><b>Transport maritime</b> : émergence de ports compétitifs (Lagos, Cotonou, Lomé, Accra, Abidjan), capacités de stockage et d'accostage en hausse pour servir aussi les pays de l'hinterland ; projet de compagnie régionale de cabotage.</li>
<li><b>Réseau fluvial</b> : trois fleuves principaux, la Gambie (1 130 km), le Niger (4 160 km) et le Sénégal (1 700 km). Organismes de mise en valeur : OMVS (1972), Autorité du bassin du Niger (1980) mais aujourd'hui peu opérants. Variations du niveau d'eau, seuils sableux et rocheux : le transport fluvial reste localisé et saisonnier.</li>
</ul>` },

    { t: "Les télécommunications et l'internet", h: `
<ul>
<li><b>Radiodiffusion et télévision</b> : premier moyen de communication à distance ; longtemps contrôlées par le pouvoir (propagande), puis ouverture à la presse privée, aux radios et télévisions de proximité dès les années 1990 avec le renouveau démocratique.</li>
<li><b>Téléphonie</b> : réformes depuis les années 1990 (libéralisation, privatisation partielle des opérateurs publics). <b>Explosion du mobile (GSM)</b> qui supplante le téléphone fixe, y compris dans les villages.</li>
<li><b>Internet</b> : liaisons terrestres inter-États en fibre optique achevées vers 2012 ; tous les États côtiers sont connectés aux câbles sous-marins. Le nombre d'internautes augmente, mais la qualité du service reste médiocre.</li>
</ul>` },

    { t: "Les avantages du développement des communications", h: `
<p><b>Dans le secteur commercial</b> (secteur tertiaire) : premier bénéficiaire. Plus de <b>90 %</b> du fret et des passagers circulent par la route. Les télécommunications assurent rapidité et sécurité des échanges. Le <b>désenclavement des pays de l'hinterland</b> favorise l'intégration régionale et les rentrées de devises.</p>
<p><b>Dans les autres secteurs</b></p>
<ul>
<li>effet en amont sur la production agricole et industrielle (augmente pour éviter la rupture de stock) ;</li>
<li>meilleur approvisionnement en matériel et intrants ;</li>
<li>effets sociaux : création d'emplois, recul du chômage, progrès social, participation citoyenne, accès à l'information et aux connaissances.</li>
</ul>` },

    { t: "Insuffisances, défis et perspectives", h: `
<p><b>Les insuffisances</b></p>
<ul>
<li><b>Routes</b> : réseau insuffisant face à l'augmentation du parc automobile, routes en mauvais état.</li>
<li><b>Chemins de fer</b> : voies vétustes, locomotives anciennes, <b>trois écartements de rails</b> qui compliquent les interconnexions.</li>
<li><b>Transport aérien</b> : domination étrangère, concurrence européenne, aéroports trop petits pour les gros porteurs, coût élevé de la maintenance.</li>
<li><b>Ports</b> : capacités insuffisantes par rapport au volume des échanges ; presque pas de liaisons maritimes entre pays membres.</li>
<li><b>Télécoms et internet</b> : pannes, déconnexions, qualité médiocre, <b>fracture numérique</b>.</li>
</ul>
<p><b>Les défis et perspectives</b></p>
<ul>
<li>mieux entretenir les infrastructures, <b>lever les barrages routiers</b> et les entraves aux frontières ;</li>
<li>créer un espace aérien régional ;</li>
<li>développer le chemin de fer pour les marchandises pondéreuses (carburant, minerais, coton) ;</li>
<li>élargir l'accès aux TIC ;</li>
<li>approche régionale concertée : libre circulation des biens, des personnes et de l'information.</li>
</ul>` }
  ],
  cles: [
    "Axes routiers communautaires : Lagos-Nouakchott (4 560 km) et Dakar-N'Djamena (4 460 km).",
    "Réseau ferré de 10 188 km, vétuste, trois écartements de rails ; boucle ferroviaire lancée en 2014.",
    "Plus de 90 % du fret et des passagers passent par la route.",
    "Ports compétitifs : Lagos, Cotonou, Lomé, Accra, Abidjan ; fleuves : Niger, Sénégal, Gambie.",
    "Explosion du mobile et fibre optique, mais fracture numérique persistante.",
    "Avantages : commerce, désenclavement de l'hinterland, emplois, accès à l'information.",
    "Défis : entretien, barrages routiers, espace aérien régional, rail, TIC."
  ]
});

SA.push({
  id: "sa3", num: 3, disc: "Histoire", titre: "Les relations internationales de 1939 à nos jours",
  question: "Comment les relations internationales ont-elles évolué de la Seconde Guerre mondiale à nos jours ?",
  intro: `<p>Le second conflit mondial, plus long et plus total que le premier, ruine l'Europe, fait émerger les États-Unis et l'URSS et nourrit le nationalisme en Asie et en Afrique. Un nouvel ordre international naît, alternant périodes de vives tensions et de coexistence pacifique.</p>`,
  parts: [
    { t: "Le monde en 1939 et le rôle de l'Afrique", h: `
<p>Profitant de la passivité des démocraties, Hitler annexe l'Autriche (mars 1938), réclame les Sudètes puis Dantzig. Il signe le <b>pacte germano-soviétique</b> (23 août 1939) dont une clause secrète prévoit le partage de la Pologne. Invasion de la Pologne le 1er septembre, déclaration de guerre franco-britannique le 3 : c'est la Seconde Guerre mondiale.</p>
<p><b>L'Afrique dans la guerre.</b> À l'exception de l'Éthiopie et du Libéria, tous les pays africains sont sous domination européenne.</p>
<ul>
<li><b>Effort militaire</b> : des centaines de milliers de soldats (tirailleurs) recrutés dans les colonies britanniques et françaises, engagés en Afrique du Nord, en Italie, en France, en Birmanie. Leur appui est déterminant dans la victoire.</li>
<li><b>Effort matériel</b> : réquisitions de denrées (maïs, riz, café, coton, noix de palme) et de minerais (cuivre, zinc, cobalt du Congo ; l'uranium congolais a servi à la bombe atomique), impôts et souscriptions.</li>
<li><b>Théâtre d'opérations</b> : l'Afrique du Nord est un champ de bataille. Rommel et l'<b>Africakorps</b> repoussent les Britanniques jusqu'aux portes d'Alexandrie ; victoire britannique d'<b>El Alamein</b> (1942) ; débarquement américain (<b>opération Torch</b>, 8 novembre 1942) ; l'Africakorps est écrasé en Tunisie le <b>13 mai 1943</b>. Le Maghreb devient la base de départ de la libération de l'Europe occidentale.</li>
</ul>` },

    { t: "Le monde au lendemain de la guerre", h: `
<p><b>Le bilan</b> : environ 55 millions de morts (les civils plus nombreux que les militaires), génocide des Juifs et horreur des camps nazis, ruines matérielles immenses en Europe et en Asie. Les États-Unis, peu touchés sur leur sol, sortent renforcés.</p>
<p><b>Yalta (4-11 février 1945) et Potsdam (17 juillet – 2 août 1945)</b></p>
<ul>
<li><b>Réorganisation de la carte</b> : l'Allemagne perd ses conquêtes, est divisée en quatre zones d'occupation (américaine, soviétique, britannique, française) ; la Pologne est déplacée vers l'ouest.</li>
<li><b>Coopération internationale</b> : création de l'<b>ONU</b> (maintien de la paix et de la sécurité) qui proclame la <b>Déclaration universelle des droits de l'homme</b> en 1948 ; le système de Bretton Woods (FMI) et le GATT (devenu OMC en 1995) pour le commerce.</li>
<li><b>Jugement des criminels</b> : procès de <b>Nuremberg</b> (1945-1946), 12 des 24 accusés condamnés à mort ; désarmement et dénazification de l'Allemagne. Message : « plus jamais ça ».</li>
</ul>` },

    { t: "La guerre froide (1947-1962)", h: `
<p><b>Définition</b> : période de rivalité entre les États-Unis et l'URSS, sans affrontement direct, car la bombe atomique instaure un « <b>équilibre de la terreur</b> ». Rupture en 1947.</p>
<p><b>Les origines</b> : fin de l'aide américaine « Prêt-bail », désaccords sur l'application de Yalta et de Potsdam, méfiance mutuelle.</p>
<p><b>Les manifestations</b></p>
<ul>
<li><b>Bloc occidental</b> : doctrine Truman (mars 1947, politique d'<b>endiguement</b> du communisme), <b>plan Marshall</b> (juin 1947), OTAN (1949).</li>
<li><b>Bloc communiste</b> : <b>Kominform</b> (1947), <b>CAEM</b> (1949), Pacte de Varsovie (1955).</li>
<li><b>Crises</b> : partition de l'Allemagne, <b>mur de Berlin</b> (1961), <b>crise des fusées de Cuba</b> (1962).</li>
</ul>` },

    { t: "Décolonisation, Bandung et non-alignement", h: `
<p>La guerre relance les révoltes des peuples dominés et rend la décolonisation irréversible.</p>
<ul>
<li><b>Asie</b> : indépendance de l'Indonésie (17 août 1945), du Viêt Nam (septembre 1945) ; en Inde, campagne de désobéissance civile de Gandhi, qui aboutit à l'Union indienne.</li>
<li><b>Afrique du Nord</b> : Bourguiba en Tunisie, Ferhat Abbas en Algérie, émeutes de Sétif réprimées en 1945.</li>
<li><b>Afrique noire</b> : leaders nationalistes comme Senghor, Sékou Touré, Kenyatta et Nkrumah.</li>
<li><b>Conférence de Bandung</b> (18-24 avril 1955, Indonésie) : 29 pays africains et asiatiques ; elle accélère la décolonisation et fait émerger le « Tiers-Monde ». <b>Belgrade (1961)</b> pose les bases du mouvement des <b>non-alignés</b>, qui refusent de rejoindre l'un ou l'autre bloc.</li>
</ul>` },

    { t: "De la guerre froide à la détente (1953-1975)", h: `
<ul>
<li><b>Dégel et coexistence pacifique (1953-1962)</b> : mort de Staline (1953), Khrouchtchev lance la coexistence pacifique (1956), rencontres au sommet (Khrouchtchev et Eisenhower en 1959). Les relations restent bipolaires, mais l'équilibre de la terreur oblige les deux Grands à éviter la guerre. Malgré tout : mur de Berlin et crise de Cuba.</li>
<li><b>Équilibre et détente (1962-1975)</b> : la crise de Cuba ouvre une période de détente. Installation du <b>« téléphone rouge »</b> entre la Maison Blanche et le Kremlin (1963). Essor du commerce Est-Ouest entre 1965 et 1975.</li>
</ul>` },

    { t: "La remise en cause des équilibres (1973-1991)", h: `
<ul>
<li><b>Choc pétrolier de 1973</b> : guerre du Kippour (6 octobre 1973), embargo pétrolier des pays arabes, prix du pétrole multiplié par quatre en trois mois, crise économique. Les Occidentaux découvrent leur dépendance énergétique.</li>
<li><b>Expansion communiste</b> : Angola et Mozambique (1975), Éthiopie (1976).</li>

SA.push({
  id: "sa4", num: 4, disc: "Géographie", titre: "La pauvreté dans le monde",
  question: "Qu'est-ce que la pauvreté, où se localise-t-elle, pourquoi persiste-t-elle et comment la combattre ?",
  intro: `<p>Le monde actuel compte des pays riches et des pays pauvres. La pauvreté, indicateur par excellence du sous-développement, est un phénomène sans frontière, mais son ampleur varie d'un pays et d'un continent à l'autre. Elle appelle des stratégies adaptées pour être réduite, voire éradiquée.</p>`,
  parts: [
    { t: "Définition et dimensions de la pauvreté", h: `
<p>La pauvreté est la condition qui empêche l'homme de satisfaire pleinement ses <b>besoins fondamentaux</b> : se nourrir, se vêtir, se soigner, se loger, s'instruire. C'est un manque de ressources matérielles élémentaires cumulées et des conditions de vie difficiles.</p>
<p>La pauvreté est <b>multidimensionnelle</b> :</p>
<ul>
<li><b>pauvreté monétaire</b> : fondée sur le revenu ou la dépense par tête ;</li>
<li><b>pauvreté d'existence</b> : fondée sur les conditions de vie et le patrimoine des ménages ;</li>
<li><b>pauvreté subjective</b> : les ménages déclarent avoir de plus en plus de difficultés.</li>
</ul>
<p>Les pays pauvres sont restés à l'abri des révolutions technologiques et affrontent des fléaux sociaux qui freinent leur émergence.</p>` },

    { t: "La localisation des pays pauvres", h: `
<p>La pauvreté est universelle mais plus marquée dans les pays du <b>Tiers-Monde</b> (pays sous-développés, pays du Sud, pays de la périphérie).</p>
<ul>
<li><b>Afrique</b> : toute l'Afrique subsaharienne (Bénin, Burkina Faso, Niger, Tchad, Togo, Somalie...) et une partie de l'Afrique du Nord ;</li>
<li><b>Asie et Pacifique</b> : Cambodge, Laos, Bangladesh, Afghanistan, Népal, Papouasie-Nouvelle-Guinée... ;</li>
<li><b>Amérique latine et Caraïbes</b> : Haïti, Guatemala, Paraguay, Pérou... ;</li>
<li><b>Europe et pays riches</b> : poches de pauvreté (sans-abri, minorités défavorisées aux États-Unis...).</li>
</ul>` },

    { t: "Les causes de la pauvreté", h: `
<p>Elles sont les mêmes que celles du sous-développement : causes internes et externes, économiques, politiques et socioculturelles.</p>
<ul>
<li><b>Causes économiques</b> : relations Nord-Sud inégales, <b>économie extravertie</b> (exportation de matières premières, importation de produits finis), <b>détérioration des termes de l'échange</b>, faible transfert de technologie, mauvaise gestion des ressources, insuffisance de financements (microcrédits), faible développement des activités génératrices de revenus.</li>
<li><b>Causes politiques</b> : méfaits de la colonisation, persistance du pacte colonial sous une forme déguisée, mauvaise gouvernance et instabilité politique après les indépendances.</li>
<li><b>Causes socioculturelles</b> : extraversion culturelle (abandon de valeurs endogènes), inégale répartition des ressources, apathie et fatalisme, corruption et détournements.</li>
</ul>` },

    { t: "Les manifestations et la persistance de la pauvreté", h: `
<p><b>Au plan économique</b> : plus d'un milliard de personnes vivent avec moins d'un dollar par jour (données des documents de référence) ; endettement croissant ; les trois quarts des pauvres vivent en milieu rural.</p>
<p><b>Au plan social</b></p>
<ul>
<li>sous-alimentation, famines, malnutrition et maladies infantiles (paludisme, diarrhée, pneumonie) ;</li>
<li>analphabétisme (surtout des femmes), faible scolarisation, déperdition scolaire ;</li>
<li>insuffisance de soins, manque d'hygiène, difficile accès à l'eau potable ;</li>
<li>chômage, sous-emploi, bidonvilles, forte natalité et forte mortalité infantile ;</li>
<li>migrations dues aux guerres et aux catastrophes.</li>
</ul>
<p><b>Les raisons de la persistance</b> : ignorance, incivisme, népotisme, mauvaise gouvernance, dépendance économique, financière et énergétique, <b>poids de la dette</b> et programmes d'ajustement structurel, dépenses d'armement qui absorbent une bonne part des budgets.</p>
<p><b>Les conséquences</b> : la pauvreté est un frein au développement (sans revenu suffisant, pas d'éducation ni de soins) et un accélérateur de crises environnementales dont les pauvres sont les premières victimes.</p>` },

    { t: "Les stratégies de lutte contre la pauvreté", h: `
<p>Il faut une politique de développement fondée sur des mesures structurelles et conjoncturelles.</p>
<p><b>Mesures structurelles</b></p>
<ul>
<li>renforcer le <b>capital humain</b> (niveau et qualité de vie, équilibre croissance économique / croissance démographique) ;</li>
<li>promouvoir l'<b>éducation</b> par des réformes adaptées et lutter contre l'analphabétisme ;</li>
<li>améliorer les services de <b>santé et de nutrition</b> pour les plus vulnérables ;</li>
<li>renforcer la <b>protection sociale</b> ;</li>
<li>promouvoir la <b>bonne gouvernance</b> économique, politique et environnementale ;</li>
<li>éducation en matière de population et de vie familiale.</li>
</ul>
<p><b>Mesures conjoncturelles</b></p>
<ul>
<li>dialogue <b>Sud-Sud</b> et consolidation des regroupements économiques ;</li>
<li>éviter la mauvaise gouvernance, source de guerres et de tensions ;</li>
<li>négocier le <b>rééchelonnement ou l'annulation de la dette</b> ;</li>
<li>actions concertées pour peser dans les négociations économiques internationales.</li>
</ul>
<p>Le combat contre la pauvreté relève d'une prise de conscience individuelle et collective.</p>` }
  ],

EXAM.push({ id: "c1", sa: "sa1", disc: "Histoire", type: "Commentaire", titre: "Briand et l'entrée de l'Allemagne à la SDN (1926)", niveau: "Facile",
contexte: "Après les tensions qui ont suivi le mauvais règlement de la Première Guerre mondiale, le monde a connu une détente dans les relations internationales à partir de 1924.",
tache: "Tu es invité(e) à commenter le document ci-dessous en mettant en lumière les faits qui ont favorisé cette détente de 1924 à 1929.",
doc: { texte: "« Arrière les fusils, les mitrailleuses, les canons ! Place à la conciliation, à l'arbitrage, à la paix. »", source: "Aristide Briand, discours prononcé à Genève, le 10 septembre 1926, pour accueillir l'Allemagne à la SDN (extrait)." },
consignes: CONS_COM,
corrige: [
`<p><b>N</b>ature : extrait de discours politique. <b>S</b>ource : discours de Briand à la SDN, Genève, 10 septembre 1926. <b>A</b>uteur : Aristide Briand, homme d'État français, ministre des Affaires étrangères, artisan de la réconciliation franco-allemande. <b>D</b>estinataire : les délégués de la SDN et l'opinion internationale. <b>C</b>ontexte : détente des années 1920, après la crise de la Ruhr (1923), le plan Dawes (1924) et Locarno (1925). <b>I</b>dée générale : la guerre doit laisser la place à la négociation. <b>D</b>écoupage : 1) rejet de la guerre ; 2) appel à la conciliation, à l'arbitrage et à la paix.</p>`,
`<p>Briand salue l'admission de l'Allemagne à la SDN : la France et l'Allemagne renoncent à régler leurs différends par les armes (« arrière les fusils »). Il appelle à la conciliation et à l'arbitrage. Raisons de sa joie : fin de l'isolement allemand, réconciliation après la guerre et la Ruhr, espoir d'une paix durable pour les peuples. Faits à rappeler : plan Dawes (août 1924), accords de Locarno (octobre 1925), arrivée d'hommes conciliants (Briand, Stresemann, Chamberlain, Kellogg).</p>`,
`<p><b>Fond</b> : le discours est sincère mais optimiste. Les différends n'ont pas disparu, la révision de Versailles reste réclamée en Allemagne, la France craint pour sa sécurité, les États-Unis ne sont pas dans la SDN. <b>Forme</b> : style oratoire, phrases courtes et exclamatives, champ lexical de la guerre opposé à celui de la paix ; texte clair mais emphatique. La paix annoncée n'est pas garantie : la crise de 1929 et la montée de Hitler le montreront.</p>`,
`<p><b>Intérêt</b> : le texte illustre l'esprit de détente et la place de la SDN en 1926. <b>Portée</b> : le pacte Briand-Kellogg (1928) et le plan Young (1929) prolongent cette détente, qui s'effondre après 1929 avec la crise et la marche vers la guerre.</p>`
]});

EXAM.push({ id: "c2", sa: "sa1", disc: "Histoire", type: "Commentaire", titre: "Mussolini et la puissance de l'État fasciste", niveau: "Moyen",
contexte: "Au lendemain de la Première Guerre mondiale, les États européens affrontent une crise économique et sociale qui favorise la montée des régimes forts.",
tache: "En vue d'approfondir tes connaissances sur le fascisme italien, tu es invité(e) à commenter le document ci-dessous.",
doc: { texte: "« Tout dans l'État, rien en dehors de l'État, rien contre l'État. »", source: "Formule de Benito Mussolini (1925), devenue l'un des mots d'ordre du fascisme." },
consignes: CONS_COM,
corrige: [
`<p><b>N</b>ature : formule politique (slogan). <b>S</b>ource : discours de Mussolini, 1925. <b>A</b>uteur : Benito Mussolini (1883-1945), fondateur du fascisme, chef du gouvernement italien à partir de 1922. <b>D</b>estinataire : le peuple italien. <b>C</b>ontexte : crise économique et sociale de 1920-1922, instabilité (six gouvernements), arrivée de Mussolini au pouvoir en 1922, lois fascistes de 1925-1926. <b>I</b>dée générale : l'État absorbe la société. <b>D</b>écoupage : 1) l'État englobe tout ; 2) personne ne peut s'y opposer.</p>`,
`<p>La formule fait de l'État le centre de la vie nationale : les individus, les syndicats, les partis et l'économie lui sont soumis. Elle justifie le parti unique, le principe d'autorité du « Duce », la suppression des libertés de presse, d'association et syndicales, et la propagande. Mussolini rejette la démocratie et le parlementarisme accusés de diviser la nation.</p>`,
`<p><b>Fond</b> : ce texte traduit l'idéologie personnelle de l'auteur plus qu'un consensus national ; il cache la violence et la répression (opposants, syndicalistes). L'État fort promis n'a pas résolu les problèmes économiques. <b>Forme</b> : formule brève, rythmée, efficace pour la propagande, mais sans argumentation.</p>`,
`<p><b>Intérêt</b> : le texte éclaire la doctrine fasciste et la nature totalitaire du régime. <b>Portée</b> : le modèle fasciste inspire d'autres dictatures (Hitler) ; l'Italie s'engage dans l'agression de l'Éthiopie (1935) et dans l'Axe Rome-Berlin, ce qui conduit à la guerre.</p>`
]});

EXAM.push({ id: "c3", sa: "sa1", disc: "Histoire", type: "Commentaire", titre: "Roosevelt face à la crise de 1929", niveau: "Difficile",
contexte: "En 1929, une crise économique de grande ampleur frappe les États-Unis avant de s'étendre au reste du monde. Chaque État tente d'apporter ses propres solutions.",
tache: "Commente le document ci-dessous pour expliquer les solutions apportées par Roosevelt à la crise.",
doc: { texte: "« Notre grande tâche prioritaire est de remettre les gens au travail. [...] La seule chose dont nous devons avoir peur, c'est la peur elle-même. »", source: "Franklin D. Roosevelt, discours d'investiture, 4 mars 1933 (extraits, traduction libre)." },
consignes: CONS_COM,
corrige: [
`<p><b>N</b>ature : extrait de discours politique. <b>S</b>ource : discours d'investiture du 4 mars 1933. <b>A</b>uteur : Franklin D. Roosevelt (1882-1945), avocat et homme d'État démocrate, 32e président des États-Unis. <b>D</b>estinataire : le peuple américain, aussi l'opinion internationale. <b>C</b>ontexte : krach de 1929, 14 millions de chômeurs, faillites de banques ; chute des Républicains. <b>I</b>dée générale : redonner confiance et mettre fin au chômage. <b>D</b>écoupage : 1) priorité au travail ; 2) appel à la confiance.</p>`,
`<p>Roosevelt fait du retour à l'emploi la priorité et annonce une action de l'État : grands travaux, aide aux agriculteurs, contrôle des banques et de la Bourse, mesures de relance. C'est le <b>New Deal</b> : dévaluation du dollar, AAA (12 mai 1933), NIRA (16 juin 1933), Tennessee Valley Authority, Social Security Act (1935). Le message vise aussi à rendre le moral à une population désemparée.</p>`,
`<p><b>Fond</b> : le New Deal a stimulé la production et fait reculer le chômage, mais il ne l'a pas éradiqué : l'économie américaine n'a retrouvé son niveau d'avant-crise qu'avec la guerre. Des lois ont été mal appliquées et le New Deal a rencontré des oppositions (patronat, Cour suprême). <b>Forme</b> : discours clair, mobilisateur, formules frappantes.</p>`,
`<p><b>Intérêt</b> : le texte montre comment une démocratie libérale répond à la crise par l'intervention de l'État. <b>Portée</b> : Roosevelt est réélu en 1936, 1940 et 1944 ; l'État-providence américain naît, et le dirigisme se diffuse dans le monde capitaliste.</p>`
]});

contexte: "Au lendemain de la Seconde Guerre mondiale, le monde se divise en deux blocs rivaux : l'Ouest autour des États-Unis, l'Est autour de l'URSS.",
tache: "Commente le document ci-dessous pour expliquer la politique américaine au début de la guerre froide.",
doc: { texte: "« La politique des États-Unis doit être de soutenir les peuples libres qui résistent à des tentatives d'asservissement. »", source: "Harry S. Truman, message au Congrès américain, 12 mars 1947 (extrait, traduction libre)." },
consignes: CONS_COM,
corrige: [
`<p><b>N</b>ature : extrait de discours politique. <b>S</b>ource : message de Truman au Congrès, 12 mars 1947. <b>A</b>uteur : Harry Truman (1884-1972), président démocrate des États-Unis de 1945 à 1953. <b>D</b>estinataire : le Congrès et l'opinion américaine. <b>C</b>ontexte : début de la guerre froide, rivalités de Yalta et de Potsdam, pressions soviétiques en Grèce et en Turquie. <b>I</b>dée générale : les États-Unis aideront les peuples menacés par le communisme. <b>D</b>écoupage : 1) principe de soutien aux peuples libres ; 2) refus de l'asservissement.</p>`,
`<p>Truman fait des États-Unis le défenseur du « monde libre » et annonce la politique d'<b>endiguement</b> (containment) du communisme. Elle se traduit par l'aide économique et militaire (Grèce, Turquie), le <b>plan Marshall</b> (juin 1947) et plus tard l'OTAN (1949). Les Soviétiques répondent avec le Kominform (1947) et le CAEM (1949).</p>`,
`<p><b>Fond</b> : le texte présente les États-Unis comme défenseurs de la liberté, alors que leur politique sert aussi leurs intérêts économiques et stratégiques (marchés pour leurs exportations, influence en Europe). Il simplifie le monde en deux camps. <b>Forme</b> : discours politique clair, ferme, à visée mobilisatrice.</p>`,
`<p><b>Intérêt</b> : il fonde la politique américaine de la guerre froide. <b>Portée</b> : il accentue la division de l'Europe en deux blocs, la course aux armements et les crises (Berlin, Cuba), jusqu'à la détente puis la fin de la guerre froide en 1991.</p>`
]});

EXAM.push({ id: "c6", sa: "sa3", disc: "Histoire", type: "Commentaire", titre: "Le rideau de fer (1946)", niveau: "Difficile",
contexte: "Dès 1946, la rivalité entre les anciens alliés de la Seconde Guerre mondiale s'installe et l'Europe se partage en deux zones d'influence.",
tache: "Commente le document ci-dessous pour expliquer la division de l'Europe au début de la guerre froide.",
doc: { texte: "« Un rideau de fer s'est abattu sur le continent. »", source: "Winston Churchill, discours prononcé à Fulton (États-Unis), le 5 mars 1946 (extrait)." },
consignes: CONS_COM,
corrige: [
`<p><b>N</b>ature : extrait de discours politique. <b>S</b>ource : discours de Fulton, 5 mars 1946. <b>A</b>uteur : Winston Churchill (1874-1965), homme d'État britannique, Premier ministre pendant la guerre. <b>D</b>estinataire : l'opinion américaine et occidentale. <b>C</b>ontexte : lendemain de Yalta et de Potsdam, soviétisation de l'Europe de l'Est. <b>I</b>dée générale : une frontière politique sépare l'Europe en deux. <b>D</b>écoupage : 1) la division de l'Europe ; 2) le danger soviétique.</p>`,
`<p>L'image du « rideau de fer » décrit la coupure entre l'Europe de l'Ouest, démocratique et capitaliste, et l'Europe de l'Est, sous influence soviétique. Elle prépare les blocs : plan Marshall et OTAN d'un côté, Kominform, CAEM et Pacte de Varsovie de l'autre. L'Allemagne est divisée, avec le mur de Berlin en 1961.</p>`,
`<p><b>Fond</b> : Churchill a raison de souligner la division, mais il présente surtout le point de vue occidental et néglige la peur soviétique de l'encerclement après les destructions de la guerre. <b>Forme</b> : métaphore frappante qui est restée dans la mémoire collective ; style imagé, persuasif.</p>`,
`<p><b>Intérêt</b> : le texte donne une expression célèbre de la guerre froide. <b>Portée</b> : l'expression devient le symbole de la division de l'Europe jusqu'en 1989-1991.</p>`
]});

EXAM.push({ id: "c7", sa: "sa4", disc: "Géographie", type: "Commentaire", titre: "La pauvreté dans le monde (données)", niveau: "Moyen",
contexte: "Malgré les progrès techniques, une partie importante de l'humanité vit dans des conditions précaires, surtout dans les pays du Sud.",
tache: "Commente le document ci-dessous pour montrer l'ampleur de la pauvreté dans le monde.",
doc: { texte: "Plus d'un milliard de personnes vivent avec moins d'un dollar par jour.\nLes trois quarts des pauvres de la planète vivent en milieu rural.\nChaque année, 11 millions d'enfants de moins de 5 ans meurent de maladies comme le paludisme, la diarrhée et la pneumonie.", source: "Données des documents de référence de la SA4 (FIDA 2001, PNUD 2009)." },
consignes: CONS_COM,
corrige: [
`<p><b>Nature</b> : ensemble de données statistiques. <b>Source</b> : documents de référence (FIDA, PNUD). <b>Thème</b> : la pauvreté dans le monde. <b>Contexte</b> : écart croissant entre pays riches et pays pauvres. <b>Idée générale</b> : la pauvreté est massive, rurale et meurtrière pour les enfants. <b>Découpage</b> : 1) pauvreté monétaire ; 2) pauvreté rurale ; 3) mortalité infantile.</p>`,
`<p>Le revenu de plus d'un milliard de personnes est inférieur à un dollar par jour : c'est la <b>pauvreté monétaire</b>. Les trois quarts des pauvres vivent à la campagne, avec peu d'accès à l'éducation, à la santé, à l'eau potable. La mort de 11 millions d'enfants par an montre la <b>pauvreté d'existence</b> : malnutrition, manque de soins, hygiène insuffisante. Causes : relations Nord-Sud inégales, mauvaise gouvernance, dette, dépendance.</p>`,
`<p><b>Qualités</b> : données fortes et parlantes. <b>Limites</b> : chiffres anciens, sans date précise ni répartition par continent ; le seuil d'un dollar ne mesure pas les autres dimensions de la pauvreté (subjective, d'existence). Les chiffres masquent les inégalités entre pays et au sein des pays.</p>`,
`<p><b>Intérêt</b> : le document montre l'ampleur et le caractère multidimensionnel de la pauvreté. <b>Portée</b> : il justifie des mesures structurelles (éducation, santé, protection sociale, bonne gouvernance) et conjoncturelles (dialogue Sud-Sud, allègement de la dette).</p>`
]});

EXAM.push({ id: "e13", sa: "sa5", disc: "Histoire", titre: "Le royaume du Danxomè : organisation politique", niveau: "Facile",
contexte: "Lors d'une visite des palais royaux d'Abomey, des élèves découvrent la puissance du royaume du Danxomè et veulent comprendre comment il était gouverné.",
tache: "Sur la base de tes connaissances, présente une dissertation en te servant des consignes ci-après.",

corrige: [
`<p>Royaume du sud du Bénin actuel, sur le plateau d'Abomey (capitale Abomey). Rois : Houégbadja, Agadja, Tegbessou, Guézo, Glèlè, Béhanzin.</p>`,
`<p>Fondé au XVIIe siècle ; Agadja conquiert Allada (1724) et Ouidah (1727) et accède à la mer ; Tegbessou consolide ; Guézo affirme l'indépendance et développe l'huile de palme ; Glèlè poursuit ; Béhanzin résiste à la conquête française et est vaincu en 1894.</p>`,
`<p>Roi sacré à pouvoir étendu ; dignitaires (Migan, Agaou, Yovogan...) avec homologues féminins ; gouverneurs de provinces et chefs de village ; recensement, impôts et justice royale.</p>`,
`<p>L'armée permet les conquêtes, assure le butin, protège le commerce et impose le respect ; elle comprend un corps féminin, les Amazones.</p>`
]});

EXAM.push({ id: "e14", sa: "sa5", disc: "Histoire", titre: "Le royaume de Nikki : économie et société", niveau: "Moyen",

// ===== Sujets supplémentaires (dissertations) pour les SA1 à SA4, communs aux séries A/B et C/D =====
const TACHE_D = "Sur la base de tes connaissances, présente une dissertation en te servant des consignes ci-après.";
function D(id, sa, disc, titre, niveau, contexte, consignes, corrige) {
  EXAM.push({ id, sa, disc, titre, niveau, contexte, tache: TACHE_D, consignes, corrige });
}
const P = t => `<p>${t}</p>`;
const L = a => `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>`;

/* ---------- SA1 ---------- */
D("d1", "sa1", "Histoire", "Les traités secondaires et le principe des nationalités", "Facile",
"À Paris, les vainqueurs de la Première Guerre mondiale règlent aussi le sort des alliés de l'Allemagne. De nouvelles frontières apparaissent en Europe centrale et au Proche-Orient.",
["Cite les traités signés avec les alliés de l'Allemagne en précisant les dates.", "Explique les conséquences de ces traités sur la carte de l'Europe centrale.", "Présente le sort réservé à l'Empire ottoman.", "Montre le rôle attendu de la SDN."],
[L(["Saint-Germain-en-Laye (10 septembre 1919) avec l'Autriche ;", "Neuilly (27 novembre 1919) avec la Bulgarie ;", "Trianon (4 juin 1920) avec la Hongrie ;", "Sèvres (10 août 1920) avec la Turquie."]),
 P("Les traités de Saint-Germain, Trianon et Neuilly démantèlent l'empire d'Autriche-Hongrie. En vertu du principe des nationalités, ils agrandissent l'Italie et la Roumanie et font naître l'Autriche, la Hongrie, la Tchécoslovaquie, la Yougoslavie et la Pologne restaurée."),
 P("Le traité de Sèvres enlève à l'Empire ottoman ses territoires arabes : certains passent sous mandat de la France et de la Grande-Bretagne, d'autres deviennent indépendants. La Turquie est réduite."),
 P("Créée en janvier 1920, la SDN doit garantir la paix par la sécurité collective, l'arbitrage et le désarmement. Elle est affaiblie dès le départ par l'absence des États-Unis, de l'Allemagne et de la Russie.")]);

D("d2", "sa1", "Histoire", "La conférence de la paix de Paris (1919)", "Facile",
"Le 18 janvier 1919 s'ouvre à Paris la conférence qui doit régler le sort de l'Allemagne et de ses alliés. Les Allemands parleront d'un « diktat ».",
["Présente l'organisation de la conférence de Paris.", "Énumère les clauses militaires du traité de Versailles.", "Explique pourquoi l'Allemagne parle de « diktat ».", "Apprécie les réactions de l'Italie, de la Grande-Bretagne et des États-Unis."],
[P("Trente-deux pays vainqueurs ou neutres y siègent, dont cinq dominent les débats (États-Unis, Grande-Bretagne, France, Italie, Japon). Les traités sont discutés entre vainqueurs uniquement : les vaincus sont exclus des négociations et la Russie bolchevique n'est pas invitée."),
 L(["armée réduite à 100 000 hommes ;", "interdiction des armes offensives ;", "service militaire supprimé ;", "Rhénanie démilitarisée ;", "livraison de la flotte de guerre aux Alliés."]),
 P("L'Allemagne n'a pas participé à l'élaboration du traité, a dû le signer sous la contrainte et s'estime mutilée territorialement, fragilisée économiquement (132 milliards de marks-or) et désarmée."),
 P("L'Italie parle de « victoire mutilée » faute d'avoir reçu Fiume et la Dalmatie ; la Grande-Bretagne, sous l'influence de Keynes, souhaite un redressement allemand ; les États-Unis, avec les Républicains, s'enferment dans l'isolationnisme et le Sénat refuse de ratifier le traité.")]);

D("d3", "sa1", "Histoire", "L'occupation de la Ruhr (1923)", "Moyen",
"En janvier 1923, des troupes françaises et belges entrent dans la Ruhr. L'épreuve de force entre la France et l'Allemagne marque l'apogée des tensions après la guerre.",
["Explique les causes de l'occupation de la Ruhr.", "Décris le déroulement de l'occupation.", "Montre ses conséquences sur l'Allemagne et sur les relations internationales.", "Explique comment ces tensions ouvrent la voie à la détente."],
[P("La France, principale bénéficiaire des réparations (52 % des 132 milliards de marks-or), veut un paiement rapide. L'Allemagne multiplie les retards de paiement et de livraison de charbon en invoquant ses difficultés économiques."),
 P("Le 11 janvier 1923, la France, soutenue par la Belgique, occupe la Ruhr, cœur industriel de l'Allemagne. Le gouvernement allemand ordonne la grève générale ; l'épreuve de force dure environ dix mois."),
 P("L'économie allemande est ruinée : le mark perd sa valeur, les prix flambent et les ouvriers et fonctionnaires connaissent la misère. La République de Weimar est fragilisée. Sur le plan international, l'opinion britannique et américaine se retourne contre la politique française."),
 P("Sous la pression des Britanniques et des Américains, la France accepte en octobre 1923 une conférence sur les réparations. Cela aboutit au plan Dawes (août 1924), puis à Locarno (1925).")]);

D("d4", "sa1", "Histoire", "Les régimes forts en URSS et en Italie", "Moyen",
"Après la Première Guerre mondiale, des régimes forts s'installent en Europe : le communisme en Russie, le fascisme en Italie.",
["Présente la dictature en URSS de Lénine à Staline.", "Explique l'arrivée de Mussolini au pouvoir.", "Décris les caractéristiques du régime fasciste.", "Dégage les points communs et les différences entre ces deux régimes."],
[P("Lénine instaure la « dictature du prolétariat », qui devient dictature du parti communiste. La NEP (1921) libéralise partiellement l'économie. L'URSS naît en décembre 1922. Staline accède au pouvoir en 1928 et durcit le régime."),
 P("En 1920-1922, l'Italie connaît une crise économique et sociale et six gouvernements se succèdent. Pour éviter une révolution sociale, le roi Victor-Emmanuel III nomme Mussolini chef du gouvernement en 1922."),
 L(["rejet de la démocratie et du parlementarisme ;", "principe d'autorité : le Duce concentre les pouvoirs ;", "parti unique et suppression des libertés de presse, d'association et syndicales (lois de 1925-1926) ;", "propagande, violence contre les opposants."]),
 P("<b>Points communs</b> : parti unique, culte du chef, limitation des libertés, contrôle de l'État. <b>Différences</b> : le communisme se réclame de la dictature du prolétariat et de l'économie collective ; le fascisme exploite la peur du communisme, défend la nation et protège la propriété privée sous contrôle de l'État.")]);

D("d5", "sa1", "Histoire", "Les démocraties libérales face aux défis de l'après-guerre", "Moyen",
"Au lendemain de la Première Guerre mondiale, les démocraties libérales peinent à s'adapter aux défis politiques et sociaux, ce qui favorise l'avènement de régimes forts.",
["Décris la fragilité de la démocratie en Grande-Bretagne.", "Présente les difficultés de la démocratie en France.", "Explique les faiblesses de la République de Weimar.", "Montre en quoi cette fragilité favorise la montée des régimes forts."],
[P("Multipartisme et instabilité gouvernementale (huit cabinets en quinze ans), chômage permanent (un actif sur dix), explosion sociale de la grève générale de 1926, crise irlandaise."),
 P("Prépondérance du Parlement et instabilité ministérielle : durée moyenne des gouvernements de sept mois. Grandes grèves en 1919 et 1920, avec les chemins de fer paralysés pendant trois semaines."),
 P("La constitution de 1919 fait de l'Allemagne une démocratie parlementaire, mais seuls les socialistes et les modérés la soutiennent. Les nationalistes ne pardonnent pas le traité de Versailles : putsch de Kapp (1920), putsch de Hitler à Munich (1923), inflation après la Ruhr."),
 P("L'instabilité et l'impuissance face aux crises discréditent le système parlementaire. Une partie des opinions se tourne vers des chefs autoritaires promettant ordre et efficacité (Mussolini en 1922, puis Hitler en 1933).")]);

D("d6", "sa1", "Histoire", "Le New Deal de Roosevelt", "Difficile",
"Élu en 1932 sur fond de crise économique, Franklin D. Roosevelt propose aux Américains une « Nouvelle Donne » pour sortir le pays de la dépression.",
["Rappelle brièvement les manifestations de la crise aux États-Unis.", "Présente les mesures d'urgence du New Deal.", "Décris les réformes structurelles et les grands travaux.", "Apprécie les résultats et les limites du New Deal."],
[P("Krach du 24 octobre 1929, retraits massifs de dépôts, faillites bancaires, arrêt des investissements, mévente, production presque divisée par deux et 14 millions de chômeurs en 1933."),
 L(["réglementation de la spéculation boursière et contrôle des banques par l'État ;", "garantie partielle des dépôts bancaires ;", "dévaluation du dollar de moitié (juin 1933) et abandon de l'étalon-or ;", "soumission des holdings au contrôle de l'État."]),
 L(["<b>AAA</b> (12 mai 1933) : crédits et indemnités aux agriculteurs ;", "<b>NIRA</b> (16 juin 1933) : codes de concurrence loyale pour relancer l'industrie ;", "<b>Tennessee Valley Authority</b> : grands travaux, emplois, électricité bon marché ;", "<b>Social Security Act</b> (1935) : assurance contre le chômage ; accords de réciprocité commerciale (1934)."]),
 P("<b>Résultats</b> : hausse des prix agricoles et industriels, croissance du PNB, recul du chômage, retour de la confiance ; Roosevelt est réélu en 1936, 1940 et 1944. <b>Limites</b> : le chômage n'est pas éradiqué, beaucoup de lois sont mal appliquées (seules les grandes entreprises appliquent les codes), le patronat et la Cour suprême s'opposent au New Deal, et l'économie ne retrouve son niveau d'avant-crise qu'avec la guerre.")]);

D("d7", "sa1", "Histoire", "Les coups de force des dictatures (1935-1939)", "Difficile",
"À partir de 1935, l'Allemagne, l'Italie et le Japon multiplient les provocations contre l'ordre établi à Versailles. Les démocraties réagissent mollement.",
["Présente l'agression italienne en Éthiopie.", "Explique la remilitarisation de la Rhénanie et l'Anschluss.", "Décris la crise des Sudètes et la conférence de Munich.", "Explique pourquoi la passivité des démocraties conduit à la guerre."],
[P("Mussolini veut une colonie de peuplement et une victoire pour le prestige du fascisme. Après l'incident de Wal-Wal (décembre 1934), il attaque l'Éthiopie le 3 octobre 1935. La guerre dure jusqu'au 6 mai 1936. La SDN est impuissante, et l'Italie se rapproche de Hitler (Axe Rome-Berlin)."),
 P("En 1936, Hitler remilitarise la Rhénanie sans réaction sérieuse de la France ni de la Grande-Bretagne. En mars 1938, après l'entrevue de Berchtesgaden, il impose l'Anschluss et annexe l'Autriche."),
 P("Hitler exige l'autonomie puis le rattachement des Sudètes, peuplés de 3,5 millions d'Allemands. Sur l'initiative de Mussolini, la conférence de Munich (29-30 septembre 1938) réunit Hitler, Mussolini, Chamberlain et Daladier : les démocraties cèdent. Le 15 mars 1939, Hitler liquide ce qui reste de la Tchécoslovaquie."),
 P("Hitler constate que les démocraties ne réagissent pas : il poursuit son expansion, signe le pacte d'acier (22 mai 1939) puis le pacte germano-soviétique (23 août 1939) et attaque la Pologne le 1er septembre 1939. Le 3 septembre, la France et la Grande-Bretagne déclarent la guerre.")]);

/* ---------- SA2 ---------- */
D("d8", "sa2", "Géographie", "Le réseau routier dans l'espace CEDEAO", "Facile",
"Un commerçant de Cotonou veut acheminer des marchandises vers le Niger par la route. Il s'interroge sur l'état du réseau routier dans l'espace CEDEAO.",
["Cite les grands axes routiers communautaires.", "Explique la place de la route dans les transports.", "Montre l'intérêt de la route pour les pays de l'hinterland.", "Relève les difficultés qui subsistent."],
[L(["route trans-côtière Lagos-Nouakchott (4 560 km, réalisée à 83 %) ;", "route trans-sahélienne Dakar-N'Djamena (4 460 km, réalisée à plus de 89 %) ;", "routes d'interconnexion (11 500 km, 67 %)."]),
 P("Plus de 90 % du fret et des passagers circulent par la route : c'est le mode de transport dominant, grâce à sa souplesse et à son coût d'installation moindre."),
 P("Les routes d'interconnexion relient le Mali, le Burkina Faso et le Niger aux ports du golfe de Guinée : elles désenclavent ces pays, facilitent leurs importations et exportations et renforcent l'intégration régionale."),
 P("Routes dégradées ou insuffisantes face à l'augmentation du parc automobile, barrages routiers, contrôles multiples, formalités aux frontières.")]);

D("d9", "sa2", "Géographie", "Le chemin de fer dans l'espace CEDEAO", "Facile",
"Le chemin de fer a longtemps joué un rôle important en Afrique de l'Ouest, mais il est aujourd'hui en déclin.",
["Présente le réseau ferroviaire de la CEDEAO.", "Explique les causes de son déclin.", "Présente le projet de boucle ferroviaire.", "Propose des mesures pour redynamiser le rail."],
