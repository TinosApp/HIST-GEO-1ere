 P("La construction de la boucle ferroviaire Niger-Bénin-Burkina-Côte d'Ivoire est lancée le 7 avril 2014 pour relier ces pays et faciliter le transport des marchandises."),
 P("Moderniser les voies et le matériel, harmoniser les écartements, interconnecter les réseaux, orienter le rail vers les marchandises pondéreuses (carburant, minerais, coton) et mobiliser des financements.")]);

D("d10", "sa2", "Géographie", "Les transports aérien et maritime dans la CEDEAO", "Moyen",
"Les échanges de la CEDEAO avec le reste du monde passent par les aéroports et surtout par les ports. Pourtant, ces secteurs souffrent de nombreuses faiblesses.",
["Décris la situation du transport aérien.", "Présente les ports de la sous-région.", "Relève les insuffisances de ces deux modes de transport.", "Propose des solutions."],
[P("Le transport aérien est peu développé : plusieurs compagnies (Air Afrique, Nigeria Airways, Ghana Airways, Air Burkina) ont disparu au profit de compagnies étrangères (Air France, Royal Air Maroc, Ethiopian Airlines). Quelques compagnies subsistent (Air Sénégal, ASKY)."),
 P("Des ports compétitifs émergent : Lagos, Cotonou, Lomé, Accra, Abidjan. Leurs capacités de stockage et d'accostage augmentent et ils servent aussi les pays de l'hinterland."),
 P("<b>Aérien</b> : domination étrangère, aéroports trop petits pour les gros porteurs, coût élevé de la maintenance. <b>Maritime</b> : capacités portuaires insuffisantes par rapport au volume des échanges, presque pas de liaisons maritimes entre pays membres."),
 P("Créer un espace aérien régional et des compagnies viables, moderniser les aéroports, étendre les ports, créer une compagnie régionale de cabotage et fluidifier les procédures portuaires.")]);

D("d11", "sa2", "Géographie", "Le réseau fluvial dans la CEDEAO", "Moyen",
"Les grands fleuves d'Afrique de l'Ouest pourraient offrir des voies de communication naturelles, mais leur utilisation reste limitée.",
["Cite les principaux fleuves de la sous-région avec leur longueur.", "Présente les organismes chargés de leur mise en valeur.", "Explique les contraintes de la navigation fluviale.", "Propose des perspectives."],
[L(["la Gambie : 1 130 km ;", "le Niger : 4 160 km ;", "le Sénégal : 1 700 km."]),
 P("L'Organisation pour la mise en valeur du fleuve Sénégal (OMVS, 1972) et l'Autorité du bassin du Niger (1980) ont été créées pour gérer ces fleuves, mais elles sont aujourd'hui peu opérantes."),
 P("Variations du niveau d'eau selon les saisons, seuils sableux et rocheux, absence d'aménagements : la navigation est localisée et saisonnière."),
 P("Aménager et entretenir les voies navigables, relancer les organismes de bassin et coordonner les États riverains pour un usage commun des fleuves.")]);

D("d12", "sa2", "Géographie", "Les télécommunications dans l'espace CEDEAO", "Moyen",
"En quelques années, les télécommunications ont profondément transformé la vie quotidienne et les affaires dans l'espace CEDEAO.",
["Présente l'évolution de la radiodiffusion et de la télévision.", "Décris les progrès de la téléphonie.", "Présente le développement de l'internet.", "Relève les insuffisances qui subsistent."],
[P("La radio est le premier moyen de communication à distance, longtemps contrôlée par les États. Avec le renouveau démocratique des années 1990, les radios et télévisions privées et de proximité se multiplient."),
 P("Réformes des années 1990 (libéralisation, privatisation partielle des opérateurs publics). Explosion du téléphone mobile (GSM), qui supplante le fixe, y compris dans les villages."),
 P("Liaisons terrestres inter-États en fibre optique vers 2012 ; tous les États côtiers sont connectés aux câbles sous-marins ; le nombre d'internautes augmente."),
 P("Pannes, déconnexions, qualité médiocre, coûts élevés, couverture inégale : c'est la fracture numérique.")]);

D("d13", "sa2", "Géographie", "Les avantages du développement des communications", "Difficile",
"La CEDEAO a fait de l'amélioration des communications une priorité pour l'intégration régionale. Un élève demande ce que cela apporte concrètement.",
["Montre les avantages dans le secteur commercial.", "Montre les avantages dans les autres secteurs.", "Identifie les effets sociaux.", "Apprécie l'importance des communications pour l'intégration régionale."],
[P("Le commerce est le premier bénéficiaire : rapidité et sécurité des échanges grâce aux télécommunications, acheminement du fret par la route (plus de 90 %), désenclavement de l'hinterland, rentrées de devises."),
 P("Meilleure circulation des intrants et des produits : la production agricole et industrielle augmente pour éviter la rupture de stock, et l'approvisionnement en matériel s'améliore."),
 P("Création d'emplois, recul du chômage, accès à l'information et aux connaissances, participation citoyenne, rapprochement des populations."),
 P("Sans communications fiables, il n'y a ni libre circulation des personnes, des biens et de l'information, ni marché commun efficace. Elles sont donc un levier essentiel de l'intégration.")]);

D("d14", "sa2", "Géographie", "Insuffisances et perspectives des communications", "Difficile",
"Malgré des progrès réels, les communications de l'espace CEDEAO restent en deçà des ambitions de la sous-région.",
["Identifie les insuffisances des transports terrestres.", "Identifie celles des autres modes de transport et des télécommunications.", "Détermine les défis à relever.", "Propose des mesures pour y répondre."],
[P("Routes insuffisantes et en mauvais état par rapport au parc automobile ; voies ferrées vétustes, locomotives anciennes, trois écartements de rails."),
 P("Transport aérien dominé par les compagnies étrangères ; ports aux capacités insuffisantes ; navigation fluviale saisonnière ; télécommunications marquées par les pannes, la qualité médiocre et la fracture numérique."),
 L(["entretenir les infrastructures ;", "lever les barrages routiers et les entraves aux frontières ;", "développer un espace aérien régional ;", "élargir l'accès aux TIC."]),
 P("Approche régionale concertée, financements durables, harmonisation des normes, développement du rail pour les marchandises pondéreuses, formation des cadres et sécurité des axes.")]);

/* ---------- SA3 ---------- */
D("d15", "sa3", "Histoire", "Les origines de la Seconde Guerre mondiale", "Facile",
"Vingt ans après la Première Guerre mondiale, le monde bascule à nouveau dans un conflit encore plus meurtrier.",
["Explique les causes de la Seconde Guerre mondiale.", "Présente les coups de force de 1938 à 1939.", "Explique la signification du pacte germano-soviétique.", "Précise les dates du déclenchement du conflit."],
[P("Le mauvais règlement de la Première Guerre mondiale, la crise économique de 1929, la montée des dictatures (Allemagne, Italie, Japon), la faiblesse de la SDN et la passivité des démocraties."),
 P("Anschluss (mars 1938), Sudètes et conférence de Munich (septembre 1938), liquidation de la Tchécoslovaquie (mars 1939), annexion de Memel, revendication de Dantzig."),
 P("Signé le 23 août 1939 par Ribbentrop et Molotov, le pacte de non-agression garantit à Hitler la neutralité soviétique ; une clause secrète prévoit le partage de la Pologne."),
 P("Le 1er septembre 1939, l'Allemagne envahit la Pologne ; le 3 septembre, le Royaume-Uni puis la France lui déclarent la guerre.")]);

D("d16", "sa3", "Histoire", "Le bilan de la Seconde Guerre mondiale", "Facile",
"En 1945, le monde découvre l'ampleur des destructions et des crimes de la guerre.",
["Présente le bilan humain de la guerre.", "Décris les destructions matérielles.", "Explique la situation de l'Europe par rapport aux États-Unis.", "Montre l'importance du jugement des criminels de guerre."],
[P("Environ 55 millions de morts, dont plus de civils que de militaires. Le génocide des Juifs et les camps nazis révèlent un niveau de cruauté sans précédent."),
 P("Des régions entières d'Europe et d'Asie sont dévastées : ponts, routes, gares, usines, villes. Les transports sont très touchés."),
 P("Privée de bras valides et ruinée, l'Europe s'affaiblit. Les États-Unis, qui n'ont pas connu de combats sur leur sol, développent leurs équipements et leur production et deviennent la première puissance."),
 P("Le procès de Nuremberg (1945-1946) juge les chefs nazis : 12 des 24 accusés sont condamnés à mort. L'objectif est de punir les coupables et de proclamer « plus jamais ça ».")]);

D("d17", "sa3", "Histoire", "Yalta, Potsdam et les organisations internationales", "Moyen",
"Avant même la fin de la guerre, les Alliés réfléchissent à la reconstruction d'un monde où la diplomatie l'emporterait sur la guerre.",
["Présente les conférences de Yalta et de Potsdam.", "Explique la réorganisation de la carte de l'Allemagne et de l'Europe.", "Présente les organisations créées pour maintenir la paix et organiser l'économie.", "Apprécie l'efficacité de ces mesures."],
[P("Yalta se tient du 4 au 11 février 1945 et Potsdam du 17 juillet au 2 août 1945. Elles réunissent les Trois Grands (Roosevelt, Churchill, Staline) pour régler le sort de l'Allemagne et organiser l'après-guerre."),
 P("L'Allemagne perd ses conquêtes ainsi que des territoires de l'est, cédés à la Pologne (elle-même amputée à l'est au profit de l'URSS), et est divisée en quatre zones d'occupation (américaine, soviétique, britannique, française)."),
 P("L'<b>ONU</b> remplace la SDN pour maintenir la paix ; elle proclame en 1948 la Déclaration universelle des droits de l'homme. Le système de Bretton Woods crée le <b>FMI</b> ; le <b>GATT</b>, devenu OMC en 1995, lutte contre le protectionnisme."),
 P("Ces organismes favorisent la coopération et la reconstruction, mais l'ONU est paralysée par la rivalité des deux Grands et l'entente de Yalta cède la place à la guerre froide.")]);

D("d18", "sa3", "Histoire", "La décolonisation et la conférence de Bandung", "Moyen",
"Après 1945, les peuples d'Asie et d'Afrique réclament leur indépendance. La conférence de Bandung en 1955 marque un tournant.",
["Explique pourquoi la Seconde Guerre mondiale accélère la décolonisation.", "Donne des exemples de mouvements nationalistes en Asie et en Afrique.", "Présente la conférence de Bandung.", "Montre son importance pour le Tiers-Monde et les non-alignés."],
[P("La guerre affaiblit les puissances coloniales, révèle leurs faiblesses et mobilise les colonisés, qui ont contribué à la victoire et réclament la liberté. Le nationalisme se renforce."),
 P("Indonésie (17 août 1945) et Viêt Nam (septembre 1945) proclament leur indépendance ; l'Inde, avec Gandhi et la désobéissance civile, obtient l'Union indienne ; en Afrique du Nord, Bourguiba (Tunisie), Ferhat Abbas (Algérie), émeutes de Sétif (1945) ; en Afrique noire, Senghor, Sékou Touré, Kenyatta, Nkrumah."),
 P("Elle se tient du 18 au 24 avril 1955 à Bandung (Indonésie) et réunit 29 pays d'Afrique et d'Asie, dont Nasser, Nehru, Soekarno et Zhou Enlai."),
 P("Elle accélère la décolonisation et fait émerger le Tiers-Monde entre les deux blocs. La conférence de Belgrade (1961) pose les bases du mouvement des non-alignés, qui refusent de se ranger dans un camp.")]);

D("d19", "sa3", "Histoire", "Des tensions à la détente (1953-1975)", "Difficile",
"Après la mort de Staline, les relations entre les deux Grands évoluent : le dégel et la détente succèdent aux tensions de la guerre froide.",
["Explique les facteurs du dégel après 1953.", "Présente les manifestations de la coexistence pacifique.", "Décris la crise de Cuba et ses conséquences.", "Montre la fragilité de la détente."],
[P("Mort de Staline (1953), arrivée de Khrouchtchev, Eisenhower attaché à la paix, équilibre de la terreur qui oblige les deux Grands à éviter la guerre."),
 P("Khrouchtchev lance la coexistence pacifique (1956) ; les contacts se multiplient (Adenauer à Moscou en 1955, Khrouchtchev chez Eisenhower en 1959, Kennedy à Vienne en 1961)."),
 P("En 1962, l'installation de missiles soviétiques à Cuba met le monde au bord de la guerre nucléaire. La crise ouvre une détente : « téléphone rouge » (1963), essor du commerce Est-Ouest (1965-1975)."),
 P("Le mur de Berlin (1961), la crise de Cuba (1962) et la persistance des conflits périphériques montrent que la rivalité des blocs demeure.")]);

D("d20", "sa3", "Histoire", "La fin de la guerre froide (1975-1991)", "Difficile",
"À partir des années 1970, l'équilibre fondé sur la détente est remis en cause, jusqu'à l'effondrement de l'URSS.",
["Explique la remise en cause des équilibres de 1973 à 1979.", "Décris le monde déstabilisé de la fin des années 1970 à 1987.", "Présente le nouvel ordre mondial de 1987 à 1991.", "Dégage les conséquences de la disparition de l'URSS."],
[P("Guerre du Kippour (6 octobre 1973), embargo pétrolier arabe et multiplication par quatre du prix du pétrole : crise économique mondiale. Expansion communiste en Angola, Mozambique (1975) et Éthiopie (1976)."),
 P("Persistance des tensions (Corée du Nord et du Sud, Chine et Taïwan), conflits régionaux dans le Tiers-Monde, apparition de « zones grises » (corruption, mafias, trafic de drogue) et risque de surarmement."),
 P("L'URSS disparaît en 1991. Les États-Unis organisent le nouvel ordre : Panama (1989), Tempête du désert (1991) ; faute de moyens, ils demandent le « partage du fardeau » au Japon et à l'Allemagne."),
 P("Fin de la bipolarité, hégémonie américaine, mais montée des conflits locaux et des incertitudes.")]);

D("d21", "sa3", "Histoire", "Le monde depuis 1991 : Moyen-Orient et nouvelles menaces", "Difficile",
"Depuis la fin de la guerre froide, le Moyen-Orient et le terrorisme sont au cœur des préoccupations internationales.",
["Explique l'invasion du Koweït par l'Irak et la réaction internationale.", "Décris la persistance des conflits (Yougoslavie).", "Présente les conséquences du 11 septembre 2001.", "Montre la place du sous-développement parmi les défis du monde actuel."],
[P("Le 2 août 1990, l'Irak de Saddam Hussein envahit le Koweït pour s'emparer de ses réserves pétrolières. L'ONU autorise une coalition de 600 000 hommes sous commandement américain ; l'opération « Tempête du désert » (17 janvier 1991) libère le Koweït."),
 P("En juin 1991, la Slovénie et la Croatie proclament leur indépendance ; la guerre de Yougoslavie s'accompagne de « purification ethnique » en Bosnie malgré la présence des Casques bleus."),
 P("Les attentats du 11 septembre 2001 affermissent l'hégémonie américaine, justifient la lutte contre le terrorisme international et redéfinissent les alliances (rapprochement avec la Russie et la Chine)."),
 P("Pauvreté, sous-développement et pandémies comme le sida restent des problèmes majeurs que la paix seule ne résout pas.")]);

/* ---------- SA4 ---------- */
D("d22", "sa4", "Géographie", "Les dimensions de la pauvreté", "Facile",
"Dans un quartier, des élèves débattent pour savoir si une personne qui gagne peu d'argent est forcément pauvre. Ils découvrent que la pauvreté a plusieurs dimensions.",
["Définis la pauvreté.", "Présente les trois dimensions de la pauvreté.", "Précise en quoi la pauvreté est un indicateur du sous-développement.", "Donne un exemple pour chaque dimension."],
[P("La pauvreté est la condition qui empêche l'homme de satisfaire pleinement ses besoins fondamentaux : se nourrir, se vêtir, se soigner, se loger, s'instruire."),
 L(["<b>monétaire</b> : fondée sur le revenu ou la dépense par tête ;", "<b>d'existence</b> : fondée sur les conditions de vie et le patrimoine des ménages ;", "<b>subjective</b> : les ménages déclarent avoir de plus en plus de difficultés."]),
 P("Elle touche surtout les pays restés à l'écart des révolutions technologiques et confrontés à des fléaux sociaux : c'est donc l'indicateur par excellence du sous-développement."),
 P("Monétaire : vivre avec moins d'un dollar par jour ; d'existence : absence d'eau potable ou de logement décent ; subjective : un ménage qui déclare ne plus s'en sortir.")]);

D("d23", "sa4", "Géographie", "Les causes économiques de la pauvreté", "Facile",
"Plusieurs pays du Sud disposent de nombreuses ressources naturelles mais restent pauvres. Les causes économiques y jouent un rôle majeur.",
["Explique l'extraversion de l'économie des pays pauvres.", "Définis la détérioration des termes de l'échange.", "Montre le rôle du manque de transfert de technologie.", "Cite d'autres causes économiques."],
[P("Les pays pauvres exportent des matières premières et importent des produits finis : leur économie dépend des marchés extérieurs et des pays riches."),
 P("Les prix des matières premières exportées baissent ou stagnent par rapport à ceux des produits importés : le Sud doit vendre davantage pour acheter la même chose."),
 P("L'absence presque totale de transfert de technologie et de compétences empêche un développement endogène, fondé sur les ressources locales."),
 L(["mauvaise gestion des ressources naturelles et humaines ;", "insuffisance de moyens financiers (microcrédits) ;", "faible développement des activités génératrices de revenus ;", "sous-développement de la main-d'œuvre agricole ; désarticulation des secteurs économiques."])]);

D("d24", "sa4", "Géographie", "Les causes politiques et socioculturelles de la pauvreté", "Moyen",
"Au-delà des causes économiques, l'histoire politique et la culture contribuent à expliquer la pauvreté de nombreux pays.",
["Explique les causes politiques de la pauvreté.", "Présente les causes socioculturelles.", "Montre le rôle de la corruption et de la mauvaise gouvernance.", "Apprécie la part des causes internes et externes."],
[P("Méfaits de la colonisation, persistance du pacte colonial sous une forme déguisée (emprise des anciennes métropoles), mauvaise gouvernance et instabilité politique après les indépendances."),
 P("Extraversion culturelle (abandon de valeurs endogènes), inégale répartition des ressources, apathie et fatalisme, malhonnêteté."),
 P("La corruption et les détournements privent les populations des ressources, découragent l'investissement et entretiennent la misère ; la mauvaise gouvernance entretient guerres et instabilité."),
 P("Les causes sont à la fois internes (gouvernance, comportements) et externes (relations Nord-Sud, colonisation, dette) : on ne peut en attribuer la responsabilité à un seul facteur.")]);

D("d25", "sa4", "Géographie", "Les manifestations sociales de la pauvreté", "Moyen",
"Dans de nombreux pays du Sud, la pauvreté se voit dans la vie quotidienne des populations.",
["Décris la situation alimentaire et sanitaire des populations pauvres.", "Présente la situation de l'éducation.", "Décris les conditions de logement et d'emploi.", "Montre les liens entre ces manifestations."],
[P("Sous-alimentation chronique, famines répétées, malnutrition et maladies infantiles (paludisme, diarrhée, pneumonie) : 11 millions d'enfants de moins de 5 ans meurent chaque année (données de référence). Insuffisance de soins, manque d'hygiène, difficile accès à l'eau potable."),
 P("Analphabétisme élevé, surtout chez les femmes, faible taux de scolarisation et forte déperdition scolaire."),
 P("Prolifération des bidonvilles, chômage et sous-emploi, développement des petits métiers, disparités sociales, migrations dues aux guerres et catastrophes."),
 P("Ces manifestations s'enchaînent : sans revenu, pas d'éducation ni de soins ; sans éducation ni santé, pas de travail productif ; la pauvreté s'entretient elle-même.")]);

D("d26", "sa4", "Géographie", "Dette, dépendance et persistance de la pauvreté", "Moyen",
"Malgré des décennies de politiques de développement, la pauvreté persiste dans de nombreux pays du Sud.",
["Explique le poids de la dette extérieure.", "Présente le rôle des programmes d'ajustement structurel.", "Montre les effets de la dépendance économique, financière et énergétique.", "Cite d'autres raisons de la persistance de la pauvreté."],
[P("Les pays pauvres très endettés consacrent une part importante de leurs ressources au remboursement, au détriment des dépenses sociales ; leur endettement croissant les maintient dans la paupérisation."),
 P("Pour obtenir des prêts, ils doivent suivre des programmes d'ajustement structurel imposés par les institutions financières internationales, souvent douloureux pour les populations."),
 P("La dépendance vis-à-vis des marchés extérieurs, des fluctuations monétaires et des cours mondiaux, ainsi que de l'énergie importée, aggrave la misère."),
 L(["ignorance et incivisme ;", "népotisme et mauvaise gouvernance ;", "dépenses d'armement qui absorbent une bonne part du budget ;", "non-respect de l'éducation relative à l'environnement et du bien public."])]);

D("d27", "sa4", "Géographie", "Pauvreté et environnement : les conséquences de la pauvreté", "Difficile",
"Dans plusieurs régions du Sud, les populations pauvres abattent des arbres pour se chauffer ou cultiver, tandis que l'environnement se dégrade.",
["Montre que la pauvreté freine le développement.", "Explique le lien entre pauvreté et crises environnementales.", "Présente les conséquences sociales et politiques de la pauvreté.", "Apprécie la responsabilité de la communauté internationale."],
[P("Sans revenu suffisant, il n'y a ni éducation ni soins, donc pas de progrès économique et social durable et réparti équitablement entre les individus."),
 P("La pauvreté est un accélérateur de crises environnementales : pression sur les terres et les forêts, mauvaise gestion de l'eau et des déchets ; les pauvres en sont les premières victimes (sécheresses, inondations)."),
 P("Migrations, bidonvilles, chômage, déviances, tensions sociales et instabilité politique."),
 P("Les pays riches portent une part de responsabilité (relations commerciales inégales, dette) et doivent contribuer par l'aide, l'annulation de dettes et des échanges plus équitables, tout en respectant la souveraineté des États.")]);

D("d28", "sa4", "Géographie", "Pauvreté en Afrique subsaharienne : causes, manifestations et solutions", "Difficile",
"L'Afrique subsaharienne concentre une grande partie des pays les plus pauvres de la planète.",
["Localise la pauvreté en Afrique subsaharienne.", "Explique ses causes principales.", "Décris ses manifestations.", "Propose des solutions durables."],
[P("Toute l'Afrique subsaharienne est concernée : Bénin, Burkina Faso, Niger, Tchad, Togo, Somalie, etc. Les trois quarts des pauvres vivent en milieu rural."),
 P("Économie extravertie, détérioration des termes de l'échange, héritage colonial et pacte colonial déguisé, mauvaise gouvernance, dette, dépendance."),
 P("Faim, maladies, analphabétisme, chômage, bidonvilles, accès limité à l'eau potable, forte natalité et mortalité infantile élevée."),
 P("<b>Structurelles</b> : éducation, santé, protection sociale, bonne gouvernance, capital humain. <b>Conjoncturelles</b> : dialogue Sud-Sud et intégration régionale, rééchelonnement ou annulation de la dette, actions concertées dans les négociations internationales.")]);

// ===== Sujets supplémentaires SA5 (séries A/B) — version provisoire =====
D("d29", "sa5", "Histoire", "Réaliser un dossier sur les anciens royaumes du Bénin", "Facile",
"Le professeur demande aux élèves de réaliser un dossier sur les anciens royaumes du Bénin à partir de recherches personnelles.",
["Énumère les trois volets à étudier pour chaque royaume.", "Cite un royaume du sud et un royaume du nord à étudier.", "Présente les étapes de la recherche documentaire.", "Explique l'intérêt d'étudier les anciens royaumes."],
[L(["l'organisation politique ;", "l'organisation économique ;", "la vie socioculturelle."]),
 P("Au sud, le Danxomè ; au nord, le royaume de Nikki (au moins une étude de cas dans chaque partie du pays)."),
 P("Exploration des représentations et formulation d'une problématique, recherche et identification des documents, sélection et classement des informations, organisation des résultats en vue d'une synthèse."),
 P("Comprendre les racines historiques de la nation béninoise, valoriser le patrimoine culturel et mesurer la diversité des organisations politiques avant la colonisation.")]);

D("d30", "sa5", "Histoire", "Origine et évolution du royaume du Danxomè", "Facile",
"À Abomey, des élèves visitent les palais royaux et cherchent à retracer l'histoire du royaume du Danxomè.",
["Situe le royaume du Danxomè.", "Présente son origine.", "Décris son évolution sous Agadja et Guézo.", "Explique la fin du royaume."],
[P("Le Danxomè est un royaume du sud du Bénin actuel, centré sur le plateau d'Abomey, sa capitale."),
 P("Il est fondé au XVIIe siècle par des Fon issus d'Allada ; Houégbadja est considéré comme le fondateur de la dynastie et de l'État."),
 P("Agadja (1708-1740) conquiert Allada (1724) et Ouidah (1727) et accède à la mer. Guézo (1818-1858) affirme l'indépendance du royaume, réorganise l'armée et développe le commerce de l'huile de palme."),

<p>La dissertation répond à une situation d'évaluation. Elle suit les consignes dans l'ordre.</p>
<ol>
<li><b>Lire la situation</b> : repère le contexte, la tâche et les consignes.</li>
<li><b>Introduction</b> : présente le sujet, rappelle le contexte, annonce le plan en suivant les consignes.</li>
<li><b>Développement</b> : une partie par consigne, avec un titre, des faits datés, des noms et des exemples précis.</li>
<li><b>Transitions</b> : relie chaque partie à la suivante en une phrase.</li>
<li><b>Conclusion</b> : résume l'essentiel et ouvre sur la suite ou sur une idée large.</li>
<li><b>Relecture</b> : vérifie les dates, l'orthographe et la lisibilité de l'écriture.</li>
</ol>` },

{ t: "Le commentaire de texte historique (NSADCID)", h: `
<p>Le commentaire comprend trois parties : introduction, corps du devoir, conclusion. Il commence souvent par « Le texte soumis à notre réflexion... ».</p>
<p><b>1. Introduction : NSADCID</b></p>
<ul>
<li><b>N</b> : nature du texte (discours, lettre, article, document juridique, statistiques...) ;</li>
<li><b>S</b> : source (titre du livre, auteur, éditeur, année, page) ;</li>
<li><b>A</b> : auteur (état civil, fonction, rôle historique) ;</li>
<li><b>D</b> : destinataire(s) ;</li>
<li><b>C</b> : contexte historique et circonstances de rédaction ;</li>
<li><b>I</b> : idée générale ;</li>
<li><b>D</b> : découpage en centres d'intérêt, avec un titre pour chacun.</li>
</ul>
<p><b>2. Corps du devoir</b></p>
<ul>
<li><b>Commentaire analytique</b> : explique le texte centre d'intérêt par centre d'intérêt (quoi ? comment ? pourquoi ?) avec le cours, sans paraphrase.</li>
<li><b>Commentaire critique</b> : au fond (erreurs, omissions, partialité, crédibilité de l'auteur) et dans la forme (style, clarté, argumentation).</li>
</ul>
<p><b>3. Conclusion</b> : l'<b>intérêt</b> du texte (ce qu'il nous apprend) et sa <b>portée</b> (ses conséquences dans le temps et dans l'espace).</p>
<p><b>À éviter</b> : récitation du cours, paraphrase, digressions, explication mot à mot, critiques non fondées. <b>À faire</b> : situer le contexte (contre l'anachronisme), éclairer les intentions de l'auteur, suivre un plan fondé sur les consignes.</p>` },

  try { store = JSON.parse(localStorage.getItem(S.storeKey) || "{}"); } catch (e) { store = {}; }
  ["best", "done", "read", "wrong"].forEach(x => { store[x] = store[x] || {}; });
  try { localStorage.setItem("hg1_series", k); } catch (e) {}
  state.tab = "fiches"; state.view = null; QZ = null; FC = null; tmStop(); TM.left = 5400;
}
let themePref = null;
try { themePref = localStorage.getItem("hg1_theme"); } catch (e) {}
function save() { try { localStorage.setItem(CFG.storeKey, JSON.stringify(store)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const badge = s => `<span class="tag ${s.disc === "Histoire" ? "h" : "g"}">${s.disc}</span>`;
const accent = s => (s.disc === "Histoire" ? "h" : "g");

/* ---------- Questions : index et fabrication ---------- */
function mkItem(r, sa) {
  if (r.length === 4) return { q: r[0], good: r[1], opts: ["Vrai", "Faux"], exp: r[3], sa };
  return { q: r[0], good: r[1], opts: shuffle([r[1], r[2], r[3], r[4]]), exp: r[5], sa };
}
const wrongKeys = () => Object.keys(store.wrong).filter(k => QIDX[k]);
const quizLabel = q => (q.type === "vf" ? "Vrai ou faux" : q.type === "syn" ? "Synthèse" : "QCM");

/* ---------- Suivi ---------- */
function progress(s) {
  const qs = QUIZ.filter(q => q.sa === s.id), es = EXAM.filter(e => e.sa === s.id);
  const qd = qs.filter(q => store.best[q.id] != null).length, ed = es.filter(e => store.done[e.id]).length, rd = store.read[s.id] ? 1 : 0;
  return { qd, qt: qs.length, ed, et: es.length, rd, pct: Math.round(100 * (qd + ed + rd) / (qs.length + es.length + 1)) };
}

/* ---------- Thème et barre du haut ---------- */
function applyTheme() {
  try { if (themePref) document.documentElement.setAttribute("data-theme", themePref); else document.documentElement.removeAttribute("data-theme"); } catch (e) {}
}
function toggleTheme() {
  let dark = false;
  try { const cur = document.documentElement.getAttribute("data-theme"); dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
  themePref = dark ? "light" : "dark"; try { localStorage.setItem("hg1_theme", themePref); } catch (e) {} applyTheme();
}
function renderTop() {

}

function renderNav() {

}
function go(tab, view) { state.tab = tab; state.view = view || null; render(); window.scrollTo(0, 0); }
function render() {
  if (!hasAccess() && (!trial || forceAccess)) {

/* ---------- Choix de la série ---------- */
function vChoix() {
  const card = k => {
    const S = SERIES[k], ok = new Set(S.sas);
    const qz = ALL.QUIZ.filter(q => ok.has(q.sa)), ex = ALL.EXAM.filter(e => ok.has(e.sa) && (k === "ab" || e.type !== "Commentaire"));
    const nq = qz.reduce((n, q) => n + q.qs.length, 0), nc = ex.filter(e => e.type === "Commentaire").length;
    return `<button class="card ser-card" data-pick="${k}"><div class="num">${S.short}</div><div class="ct"><h2>${S.label}</h2><p>${S.sas.length} situations d'apprentissage · ${nq} questions de quiz · ${ex.length} sujets corrigés${nc ? " dont " + nc + " commentaires de document" : ""}</p></div></button>`;
  };
  return `<header class="hero"><p class="eyebrow">Histoire-Géographie · Classes de 1ère</p><h1>Choisis ta série</h1><p class="q">Cours résumés, sujets corrigés, quiz et repères. Le contenu s'adapte à ta série ; tu pourras en changer à tout moment avec le bouton en haut.</p></header>
  ${card("ab")}${card("cd")}
  <p class="note">Ta progression est enregistrée séparément pour chaque série, sur cet appareil.</p>
  ${ownerLine()}`;
}

/* ---------- Accueil et fiches ---------- */
function vFiches() {
  const v = state.view;
  if (v && v.sa) return SAMAP[v.sa] ? ficheDetail(SAMAP[v.sa]) : vLocked("Cette situation d'apprentissage est réservée aux détenteurs d'un code.");
  const tot = SA.map(progress);
  const sum = k => tot.reduce((n, p) => n + p[k], 0);
  const nw = wrongKeys().length;
  return `<header class="hero"><p class="eyebrow">${CFG.classe}</p><h1>Histoire-Géographie</h1><p class="q">${CFG.accroche}</p></header>
  ${isTrial() ? trialBox() : ""}
  <div class="stats">
    <div><b>${sum("qd")}/${sum("qt")}</b><span>quiz faits</span></div>
    <div><b>${sum("ed")}/${sum("et")}</b><span>sujets traités</span></div>
    <div><b>${nw}</b><span>erreurs à revoir</span></div>
  </div>
  <div class="row"><button class="btn" data-mix="all">Quiz mixte de 10 questions</button>${nw ? `<button class="btn alt" data-wrongstart="1">Refaire mes erreurs (${nw})</button>` : ""}</div>
  <h2 class="sec">Les situations d'apprentissage</h2>
  ${SA.map((s, i) => { const p = tot[i]; return `<button class="card ${accent(s)}" data-go="fiches" data-sa="${s.id}"><div class="num ${accent(s)}">SA${s.num}</div><div class="ct"><h2>${esc(s.titre)}</h2><p>${badge(s)} ${s.parts.length} parties · ${p.qt} quiz · ${p.et} sujets</p><div class="bar" aria-label="Progression ${p.pct} %"><i style="width:${p.pct}%"></i></div><p class="pc">${p.pct} % étudié</p></div></button>`; }).join("")}
  ${LOCKED.map(lockedCard).join("")}
  <p class="note">Ta progression est enregistrée sur cet appareil. Utilise la barre du bas pour passer aux sujets, quiz, repères et méthodes.</p>
  ${ownerLine()}`;
}

/* ---------- Sujets ---------- */
const TM = { left: 5400, run: false, id: null };
function fmt(t) { const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"); }
function tmStop() { if (TM.id) { clearInterval(TM.id); TM.id = null; } TM.run = false; }
function tmToggle() {
  if (TM.run) { tmStop(); }
  else if (TM.left > 0) {
    TM.run = true;
    TM.id = setInterval(() => { TM.left--; const el = $("#tm"); if (el) el.textContent = fmt(TM.left); if (TM.left <= 0) { tmStop(); TM.left = 0; render(); } }, 1000);
  }
  render();
}
function vEpreuves() {
  const v = state.view || {};
  if (v.ex) {
    const e = EXAM.find(x => x.id === v.ex), s = SAMAP[e.sa], open = !!v.corrige, done = !!store.done[e.id];
    return `<button class="back" data-go="epreuves" data-sa="${v.filter || ""}">‹ Liste des sujets</button>
    <header class="hd"><p class="eyebrow">SA${s.num} · ${e.type || "Dissertation"} · ${e.niveau}</p><h1>${esc(e.titre)}</h1></header>
    <div class="timer"><span class="tl">Chronomètre</span><b id="tm">${fmt(TM.left)}</b><button class="mini" data-tm="toggle">${TM.run ? "Pause" : TM.left <= 0 ? "Terminé" : "Démarrer"}</button><button class="mini alt" data-tm="reset">Remise à zéro</button></div>
    <div class="box"><h3>Situation d'évaluation</h3><p><b>Contexte :</b> ${esc(e.contexte)}</p><p><b>Tâche :</b> ${esc(e.tache)}</p>
    ${e.doc ? `<h3>Document</h3><blockquote class="doc">${esc(e.doc.texte).replace(/\n/g, "<br>")}</blockquote><p class="muted">${esc(e.doc.source)}</p>` : ""}
    <h3>Consignes</h3><ol>${e.consignes.map(c => `<li>${esc(c)}</li>`).join("")}</ol></div>
    <div class="box small"><h3>Critères de correction</h3><ul><li>Interprétation correcte de la situation</li><li>Utilisation correcte des outils de la discipline</li><li>Cohérence interne</li><li>Perfectionnement : qualité de la langue et présentation</li></ul><p class="muted">${e.type === "Commentaire" ? "Barème indicatif sur 20 : présentation 4, explication 6, critique 4, intérêt et portée 3, langue et présentation 3." : "Barème indicatif sur 20 : 4 points par consigne (16 points) et 4 points pour la cohérence d'ensemble, la langue et la présentation."}</p></div>
    <div class="row"><button class="btn" data-corr="${e.id}">${open ? "Masquer le corrigé" : "Voir le corrigé"}</button><button class="btn alt" data-done="${e.id}">${done ? "✓ Sujet traité" : "Marquer comme traité"}</button></div>
    ${open ? `<div class="corr"><h3>Corrigé type</h3>${e.consignes.map((c, i) => `<div class="cq"><p class="cqt">${e.type === "Commentaire" ? ["Introduction (présentation)", "Partie analytique", "Partie critique", "Conclusion (intérêt et portée)"][i] : "Consigne " + (i + 1)} : ${esc(c)}</p>${e.corrige[i]}</div>`).join("")}</div>` : ""}`;
  }
  const f = v.sa || "", todo = !!v.todo;
  const list = EXAM.filter(e => (!f || e.sa === f) && (!todo || !store.done[e.id])).sort((a, b) => SA.findIndex(x => x.id === a.sa) - SA.findIndex(x => x.id === b.sa));
  const nd = EXAM.filter(e => store.done[e.id]).length;
  return `<header class="hd"><p class="eyebrow">Sujets</p><h1>Sujets corrigés</h1><p class="q">${EXAM.length} sujets selon le modèle : contexte, tâche, consignes. ${nd} traité${nd > 1 ? "s" : ""}. Essaie sans regarder le corrigé.</p></header>
  <div class="chips"><button class="chip ${!f ? "on" : ""}" data-go="epreuves" data-sa="" data-todo="${todo ? "1" : ""}">Toutes</button>${SA.map(s => `<button class="chip ${f === s.id ? "on" : ""}" data-go="epreuves" data-sa="${s.id}" data-todo="${todo ? "1" : ""}">SA${s.num}</button>`).join("")}<button class="chip ${todo ? "on" : ""}" data-etodo="1">Non traités</button></div>
  ${list.map(e => { const s = SAMAP[e.sa]; return `<button class="card ${accent(s)}" data-ex="${e.id}" data-f="${f}"><div class="num ${accent(s)}">SA${s.num}</div><div class="ct"><h2>${esc(e.titre)}</h2><p>${badge(s)} ${e.type || "Dissertation"} · ${e.niveau}${store.done[e.id] ? " · <b class=\"okt\">✓ traité</b>" : ""}</p></div></button>`; }).join("") || `<p class="note">Tous les sujets de ce filtre sont traités. Bravo !</p>`}`;
}

/* ---------- Quiz ---------- */
let QZ = null;
function vQuiz() {
  if (QZ) return quizScreen();
  const v = state.view || {}, f = v.sa || "";
  const list = QUIZ.filter(q => !f || q.sa === f), nw = wrongKeys().length;
  return `<header class="hd"><p class="eyebrow">Quiz</p><h1>Quiz par thème</h1><p class="q">Correction immédiate avec explication. Ton meilleur score est enregistré sur cet appareil.</p></header>
  <div class="row"><button class="btn" data-mix="${f || "all"}">Quiz mixte (10 questions)</button>${nw ? `<button class="btn alt" data-wrongstart="1">Mes erreurs (${nw})</button>` : ""}</div>
  <div class="chips"><button class="chip ${!f ? "on" : ""}" data-go="quiz" data-sa="">Tous</button>${SA.map(s => `<button class="chip ${f === s.id ? "on" : ""}" data-go="quiz" data-sa="${s.id}">SA${s.num}</button>`).join("")}</div>
  ${list.map(q => { const s = SAMAP[q.sa], b = store.best[q.id]; return `<button class="card ${accent(s)}" data-q="${q.id}"><div class="num ${accent(s)}">SA${s.num}</div><div class="ct"><h2>${esc(q.titre)}</h2><p><span class="tag k">${quizLabel(q)}</span> ${q.qs.length} questions${b != null ? ` · meilleur : <b class="okt">${b}/${q.qs.length}</b>` : ""}</p></div></button>`; }).join("")}`;
}
function begin(titre, items, id, mode) { state.tab = "quiz"; state.view = null; QZ = { id, titre, mode, items, i: 0, score: 0, picked: null, wrong: [] }; render(); window.scrollTo(0, 0); }
function startQuiz(id) { const q = QUIZ.find(x => x.id === id); begin(q.titre, shuffle(q.qs).map(r => mkItem(r, q.sa)), id, "quiz"); }
function startMix(sa) {
  const pool = []; QUIZ.filter(q => sa === "all" || q.sa === sa).forEach(q => q.qs.forEach(r => pool.push(mkItem(r, q.sa))));
  begin("Quiz mixte" + (sa === "all" ? "" : " · SA" + SAMAP[sa].num), shuffle(pool).slice(0, 10), "mix", "mix");
}
function startWrong() {
  const ks = shuffle(wrongKeys()).slice(0, 15);
  if (!ks.length) return;
  begin("Mes erreurs", ks.map(k => mkItem(QIDX[k].r, QIDX[k].sa)), "wrong", "wrong");
}
function quizScreen() {
  const z = QZ, n = z.items.length;
  if (z.i >= n) {
    if (z.mode === "quiz") { if ((store.best[z.id] || 0) < z.score || store.best[z.id] == null) store.best[z.id] = Math.max(z.score, store.best[z.id] || 0); save(); }
    const pct = Math.round(100 * z.score / n);
    const msg = pct === 100 ? "Parfait !" : pct >= 70 ? "Très bien, continue ainsi." : pct >= 50 ? "Correct, relis la fiche pour progresser." : "Relis la fiche de cours puis recommence.";
    return `<header class="hero"><p class="eyebrow">Résultat</p><h1>${z.score} / ${n}</h1><p class="q">${msg}</p></header>
    ${z.wrong.length ? `<div class="box"><h3>À revoir</h3>${z.wrong.map(w => `<p><b>${esc(w.q)}</b><br>${esc(w.good)}</p>`).join("")}<p class="muted">Ces questions sont enregistrées dans « Mes erreurs ».</p></div>` : ""}
    <div class="row">${z.mode === "quiz" ? `<button class="btn" data-q="${z.id}">Recommencer</button>` : z.mode === "mix" ? `<button class="btn" data-mix="${z.titre.includes("SA") ? z.items[0].sa : "all"}">Nouveau quiz mixte</button>` : ""}${z.wrong.length ? `<button class="btn alt" data-wrongstart="1">Refaire mes erreurs</button>` : ""}<button class="btn alt" data-quit="1">Retour aux quiz</button></div>`;
  }
  const it = z.items[z.i], a = z.picked != null;
  return `<button class="back" data-quit="1">‹ Quitter</button>
  <div class="prog"><div style="width:${Math.round(100 * z.i / n)}%"></div></div>
  <p class="muted">${esc(z.titre)} · question ${z.i + 1} sur ${n} · score ${z.score}</p>
  <h2 class="qt">${esc(it.q)}</h2>
  <div class="opts">${it.opts.map((o, k) => { let c = "opt"; if (a) { if (o === it.good) c += " ok"; else if (k === z.picked) c += " ko"; } return `<button class="${c}" data-opt="${k}" ${a ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>
  ${a ? `<div class="fb ${it.opts[z.picked] === it.good ? "okb" : "kob"}"><b>${it.opts[z.picked] === it.good ? "Bonne réponse." : "Mauvaise réponse."}</b> ${it.opts[z.picked] === it.good ? "" : "La bonne réponse est : " + esc(it.good) + "."}<br>${esc(it.exp)}</div>
  <button class="btn sticky" data-next="1">${z.i + 1 >= n ? "Voir le résultat" : "Question suivante"}</button>` : ""}`;
}

/* ---------- Réviser ---------- */

  ${SA.map(s => `<details class="acc"><summary>SA${s.num} · ${esc(s.titre)}</summary><div class="acc-b"><ul>${s.cles.map(c => `<li>${esc(c)}</li>`).join("")}</ul><button class="btn alt" data-fc="${s.id}">Cartes mémoire de la SA${s.num}</button></div></details>`).join("")}

function startFC(sa) {

/* ---------- Repères ---------- */

  }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target && ev.target.id === "code") tryActivate(); });
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.activate) { tryActivate(); return; }
  if (d.trial) { trial = true; forceAccess = false; render(); window.scrollTo(0, 0); return; }
  if (d.unlock || d.lock) { forceAccess = true; render(); window.scrollTo(0, 0); return; }
  if (d.pick) { setSeries(d.pick); render(); window.scrollTo(0, 0); return; }
  if (d.switch) { SK = null; QZ = null; FC = null; tmStop(); try { localStorage.removeItem("hg1_series"); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  if (d.thm) { toggleTheme(); renderTop(); return; }
  if (d.tab) { QZ = null; FC = null; go(d.tab); return; }
  if (d.q) { startQuiz(d.q); return; }
  if (d.mix) { startMix(d.mix); return; }
  if (d.wrongstart) { startWrong(); return; }
  if (d.quit) { QZ = null; render(); return; }
  if (d.opt != null && QZ) {
    const it = QZ.items[QZ.i]; QZ.picked = +d.opt;
    if (it.opts[QZ.picked] === it.good) { QZ.score++; delete store.wrong[it.q]; } else { QZ.wrong.push({ q: it.q, good: it.good }); store.wrong[it.q] = 1; }
    save(); render(); return;
  }
  if (d.next && QZ) { QZ.i++; QZ.picked = null; render(); window.scrollTo(0, 0); return; }
  if (d.fc) { startFC(d.fc); window.scrollTo(0, 0); return; }
  if (d.fcshow) { FC.show = true; render(); return; }
  if (d.fcok || d.fcko) {
    const c = FC.cards[FC.i];
    if (d.fcko) store.wrong[c.q] = 1; else delete store.wrong[c.q];
    save(); FC.i++; FC.show = false; if (FC.i >= FC.cards.length) FC = null; render(); window.scrollTo(0, 0); return;
  }
  if (d.fcquit) { FC = null; render(); return; }
  if (d.rep) { state.view = Object.assign({}, state.view, { [d.rep]: d.v }); render(); return; }
  if (d.corr) { state.view.corrige = !state.view.corrige; render(); return; }
  if (d.done) { store.done[d.done] = !store.done[d.done]; save(); render(); return; }
  if (d.read) { store.read[d.read] = !store.read[d.read]; save(); render(); return; }
  if (d.etodo) { state.view = Object.assign({}, state.view, { todo: !(state.view || {}).todo }); render(); return; }
  if (d.tm) { if (d.tm === "toggle") tmToggle(); else { tmStop(); TM.left = 5400; render(); } return; }
  if (d.ex) { tmStop(); TM.left = 5400; state.view = { ex: d.ex, filter: d.f, corrige: false }; render(); window.scrollTo(0, 0); return; }
  if (d.go) {
    QZ = null;
    const view = d.sa !== undefined ? { sa: d.sa, todo: !!d.todo } : null;
    go(d.go, view); return;
  }
});
applyTheme();
try { const last = localStorage.getItem("hg1_series"); if (last && SERIES[last]) setSeries(last); } catch (e) {}
render();
</script>
